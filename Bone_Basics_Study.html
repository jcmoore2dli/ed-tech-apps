<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bone Basics Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered column (max 720px), big tap targets, one instruction line above each question.
   Palette: warm paper + periwinkle accent (echoes the course slides); semantic green/red for grading. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #efece4;
  --ink: #1e1c19;
  --muted: #655f56;
  --line: #d9d3c6;
  --accent: #5457c0;
  --accent-ink: #ffffff;
  --accent-soft: #e4e5f8;
  --good: #1f7a46;
  --good-bg: #e3f3e8;
  --bad: #b2271d;
  --bad-bg: #fbe7e4;
  --warn-bg: #fff3d6;
  --warn: #8a5a00;
  --bone: #efe2cc;
  --bone-edge: #8a6d4e;
  --shadow: 0 1px 2px rgba(30,28,25,.06), 0 4px 14px rgba(30,28,25,.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161b; --surface: #1f2027; --surface-2: #2a2b34; --ink: #ecebf0; --muted: #a7a6b3; --line: #383944;
    --accent: #8f92f2; --accent-ink: #101120; --accent-soft: #2b2d4d;
    --good: #6fd198; --good-bg: #17301f; --bad: #ff9a8f; --bad-bg: #3b1f1b; --warn-bg: #3a2f14; --warn: #ffd27a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161b; --surface: #1f2027; --surface-2: #2a2b34; --ink: #ecebf0; --muted: #a7a6b3; --line: #383944;
  --accent: #8f92f2; --accent-ink: #101120; --accent-soft: #2b2d4d;
  --good: #6fd198; --good-bg: #17301f; --bad: #ff9a8f; --bad-bg: #3b1f1b; --warn-bg: #3a2f14; --warn: #ffd27a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; letter-spacing: .01em; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink); font-size: 17px; }
.brand:hover { color: var(--accent); }
.brand { white-space: nowrap; }
.tag { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 20px 48px; }
h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 4px; text-wrap: balance; }
h2 { font-size: 20px; margin: 20px 0 10px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 18px; }

/* Home */
.topics { display: grid; gap: 10px; margin: 0 0 18px; }
.topic-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  box-shadow: var(--shadow);
}
.topic-btn:hover { border-color: var(--accent); }
.topic-btn .name { font-weight: 700; font-size: 18px; }
.topic-btn .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.topic-btn .score { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.pill.missed { background: var(--bad-bg); color: var(--bad); }
.pill.clear { background: var(--good-bg); color: var(--good); }
.pill.extra { background: var(--surface-2); color: var(--muted); }
.big-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 16px 18px; border-radius: 12px; border: 0; cursor: pointer; font-size: 18px; font-weight: 700;
  background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
}
.big-btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.big-btn:disabled { opacity: .55; cursor: default; }
.big-btn .meta { font-size: 14px; font-weight: 500; opacity: .85; white-space: nowrap; }
.home-actions { display: grid; gap: 10px; }
.reset-row { margin-top: 28px; font-size: 14px; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }
.link-btn:hover { color: var(--bad); }
.confirm { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.small-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; }
.small-btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }

/* Quiz */
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.qhead .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.instruction { font-size: 14px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
.prompt { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 16px; text-wrap: pretty; }
.retry-note { display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
.diagram { background: #fffdf8; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 0 0 16px; }
.diagram svg { display: block; width: 100%; height: auto; max-width: 100%; }

.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; min-height: 52px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; line-height: 1.3;
}
.opt:hover { border-color: var(--accent); }
.opt .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.opt.radio .box { border-radius: 50%; }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.selected .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .box { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .box { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.missed-opt { border-color: var(--good); border-style: dashed; }
.opt.missed-opt .box { border-color: var(--good); color: var(--good); }
.opt[disabled] { cursor: default; }
.opt .lbl { flex: 1; min-width: 0; }
.opt .note { flex: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.opt.right .note { color: var(--good); } .opt.wrong .note { color: var(--bad); } .opt.missed-opt .note { color: var(--good); }

/* Matching */
.match { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match .col-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.chip {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 10px; min-height: 48px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.25;
}
.chip .lbl { flex: 1; min-width: 0; }
.chip .badge { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.chip.selected { border-color: var(--accent); background: var(--accent-soft); }
.chip.paired .badge { background: var(--accent); color: var(--accent-ink); }
.chip.right { border-color: var(--good); background: var(--good-bg); }
.chip.wrong { border-color: var(--bad); background: var(--bad-bg); }
.chip[disabled] { cursor: default; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.hint { font-size: 14px; color: var(--muted); }

/* Sorting */
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: 60px; border: 2px dashed var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; }
.pool.empty::after { content: "All tiles placed. Tap a tile in a box to move it back here."; color: var(--muted); font-size: 14px; }
.tile { padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.25; text-align: left; }
.tile.selected { border-color: var(--accent); background: var(--accent-soft); }
.tile.right { border-color: var(--good); background: var(--good-bg); }
.tile.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tile[disabled] { cursor: default; }
.boxes { display: grid; gap: 10px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.boxes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dropbox { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px; min-height: 110px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.dropbox.target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dropbox .box-title { font-weight: 700; font-size: 15px; color: var(--accent); }
.dropbox .box-tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.dropbox .box-tiles .tile { font-size: 14px; padding: 7px 10px; }
.tile .fix { display: block; font-size: 12px; color: var(--bad); font-weight: 600; }

/* Buttons + feedback */
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.primary { padding: 14px 24px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; cursor: pointer; min-width: 140px; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { padding: 14px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 17px; cursor: pointer; }
.feedback { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.feedback.good { border-color: var(--good); background: var(--good-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback .verdict { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
.feedback.good .verdict { color: var(--good); } .feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 4px 0; }
.feedback .ans { font-weight: 600; }
.feedback ul { margin: 6px 0 0; padding-left: 18px; }
.feedback li { margin: 3px 0; }
.ok { color: var(--good); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }

/* Results */
.score-card { text-align: center; padding: 24px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 16px; }
.score-card .big { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score-card .sub { color: var(--muted); margin-top: 6px; }
.per-topic { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: 15px; }
.per-topic th, .per-topic td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.per-topic td:last-child, .per-topic th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 12px; }
.review-item { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.review-item .tp { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.review-item .q { font-weight: 600; margin: 4px 0 8px; }
.review-item p { margin: 4px 0; font-size: 15px; }
.review-item .diagram { margin-top: 8px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
@media (max-width: 420px) {
  body { font-size: 16px; }
  .prompt { font-size: 18px; }
  .topic-btn { flex-direction: column; align-items: flex-start; }
  .topic-btn .meta { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .big-btn { flex-direction: column; align-items: flex-start; gap: 4px; }
}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button id="homeLink" class="brand" type="button">Bone Basics Study</button>
  <span id="modeTag" class="tag"></span>
</div></header>
<main class="wrap">
  <section id="home" aria-label="Home"></section>
  <section id="quiz" aria-label="Question" hidden></section>
  <section id="results" aria-label="Results" hidden></section>
</main>

<script>
// ============================================================
// ITEM BANK — edit here. Every item: id, topic, format, prompt,
// answer data, and a one-sentence "explain" taken from the course.
// Formats: "mc" (options[0] is correct; options are shuffled at
// play time), "sata" (options + answer array), "match" (pairs of
// [term, definition]), "sort" (boxes + tiles of [tile, boxName]).
// "img": "longbone" shows the numbered long-bone diagram.
// Source tags in "src": SG = Study Guide KEY, BB = Bone Basics slides,
// TB = Types of Bones slides, FR = Fracture Repair slides, SD = Speed Dating.
// "skill": "identify" marks "name this bone" items; identifyCap limits how
// many appear in one 10-question set and in one Practice Test.
// ============================================================
const BANK = {
  "topics": [
    {"key": "functions",    "name": "Functions of Bones"},
    {"key": "types",        "name": "Types of Bones"},
    {"key": "longbone",     "name": "Parts of a Long Bone"},
    {"key": "axial",        "name": "Axial vs. Appendicular"},
    {"key": "cells",        "name": "Bone Cells & Remodeling"},
    {"key": "ossification", "name": "Endochondral Ossification"},
    {"key": "fracture",     "name": "Fracture Repair"},
    {"key": "extra",        "name": "Extra: Fracture Types", "extra": true}
  ],
  "testAllocation": {"functions": 4, "types": 4, "longbone": 5, "axial": 5, "cells": 4, "ossification": 4, "fracture": 4},
  "identifyCap": {"set": 2, "test": 1},
  "items": [

  /* ───────────────── 1. FUNCTIONS OF BONES ───────────────── */
  {"id":"FN01","topic":"functions","format":"mc","src":"SG9",
   "prompt":"How many functions of bone tissue did we learn?",
   "options":["7","4","5","9"],
   "explain":"The study guide lists 7 functions: support, protection, anchorage, mineral storage, blood cell formation, fat storage, and hormone production."},
  {"id":"FN02","topic":"functions","format":"mc","src":"BB Support",
   "prompt":"\"Bones provide a framework for the rest of the body.\" Which function is this?",
   "options":["Support","Protection","Anchorage","Mineral storage"],
   "explain":"Support means bones provide a framework for the rest of the body."},
  {"id":"FN03","topic":"functions","format":"mc","src":"BB Blood Cell Formation",
   "prompt":"Hematopoiesis (blood cell production) occurs in the…",
   "options":["Red marrow","Yellow marrow","Compact bone","Articular cartilage"],
   "explain":"Hematopoiesis, blood cell production, occurs in the red marrow."},
  {"id":"FN04","topic":"functions","format":"mc","src":"BB Fat Storage",
   "prompt":"Where is fat stored in bone?",
   "options":["In the yellow marrow inside long bones","In the red marrow of the epiphyses","In the compact bone of the diaphysis","In the periosteum"],
   "explain":"Fat is stored in the yellow marrow inside long bones."},
  {"id":"FN05","topic":"functions","format":"mc","src":"BB Hormone Production",
   "prompt":"Which hormone do bones produce?",
   "options":["Osteocalcin","Osteoid","Hematopoiesis","Calcium"],
   "explain":"Bones produce osteocalcin, a hormone that helps with many body processes."},
  {"id":"FN06","topic":"functions","format":"mc","src":"BB Mineral Storage",
   "prompt":"Bones are reservoirs for which two minerals?",
   "options":["Calcium and phosphate","Iron and sodium","Calcium and iron","Potassium and phosphate"],
   "explain":"Bones are reservoirs for calcium and phosphate and release them into the bloodstream as needed."},
  {"id":"FN07","topic":"functions","format":"mc","src":"BB Anchorage",
   "prompt":"Skeletal muscles attach to bones by…",
   "options":["Tendons","Ligaments","Cartilage","Periosteum"],
   "explain":"Skeletal muscles attach to bones by tendons, using bones as levers to move the body."},
  {"id":"FN08","topic":"functions","format":"mc","src":"BB Protection",
   "prompt":"The skull protects the…",
   "options":["Brain","Spinal cord","Heart and lungs","Reproductive organs"],
   "explain":"The skull protects the brain."},
  {"id":"FN09","topic":"functions","format":"mc","src":"BB Protection",
   "prompt":"The vertebrae protect the…",
   "options":["Spinal cord","Brain","Heart and lungs","Reproductive organs"],
   "explain":"The vertebrae protect the spinal cord."},
  {"id":"FN10","topic":"functions","format":"mc","src":"BB Protection",
   "prompt":"The ribcage protects the…",
   "options":["Heart and lungs","Brain","Spinal cord","Reproductive organs"],
   "explain":"The ribcage protects the heart and lungs."},
  {"id":"FN11","topic":"functions","format":"mc","src":"SG10",
   "prompt":"The pelvis protects the…",
   "options":["Reproductive organs","Heart and lungs","Spinal cord","Brain"],
   "explain":"The study guide lists the pelvis as protecting the internal reproductive organs."},
  {"id":"FN12","topic":"functions","format":"mc","src":"SG9",
   "prompt":"\"Muscles attach to and pull on bones, which causes movement.\" Which function is this?",
   "options":["Anchorage","Support","Protection","Hormone production"],
   "explain":"Anchorage: skeletal muscles attach to bones and use them as levers to move the body."},
  {"id":"FN13","topic":"functions","format":"mc","src":"BB Mineral Storage",
   "prompt":"\"Bones release calcium and phosphate into the bloodstream as needed.\" Which function is this?",
   "options":["Mineral storage","Fat storage","Blood cell formation","Support"],
   "explain":"Mineral storage: bones are reservoirs for calcium and phosphate and share them with organs that need them."},
  {"id":"FN14","topic":"functions","format":"mc","src":"BB Blood Cell Formation",
   "prompt":"What does the term hematopoiesis mean?",
   "options":["Blood cell production","Fat storage","Bone remodeling","Hormone production"],
   "explain":"Hematopoiesis means blood cell production, which happens in the red marrow."},
  {"id":"FN15","topic":"functions","format":"mc","src":"SG11",
   "prompt":"Which other type of tissue do bones work with to cause movement?",
   "options":["Skeletal muscle tissue","Cartilage","Nervous tissue","Epithelial tissue"],
   "explain":"Bones work together with skeletal muscle tissue to cause movement."},
  {"id":"FN16","topic":"functions","format":"mc","src":"BB Anchorage",
   "prompt":"Muscles use bones as ______ to move the body.",
   "options":["Levers","Springs","Shields","Pumps"],
   "explain":"Skeletal muscles attach to bones by tendons and use bones as levers to move the body."},
  {"id":"FN17","topic":"functions","format":"mc","src":"SG5",
   "prompt":"How many bones are in the adult human skeleton?",
   "options":["206","196","216","260"],
   "explain":"There are 206 bones in the adult human skeleton."},
  {"id":"FN18","topic":"functions","format":"mc","src":"SG1",
   "prompt":"What two types of tissue make up your skeleton?",
   "options":["Cartilage and bone","Bone and muscle","Bone and tendon","Cartilage and muscle"],
   "explain":"The skeleton is made of both bones and cartilage."},
  {"id":"FN19","topic":"functions","format":"mc","src":"SG9",
   "prompt":"Which function of bone takes place in the red marrow?",
   "options":["Blood cell formation","Mineral storage","Fat storage","Protection"],
   "explain":"Blood cell formation (hematopoiesis): all 3 types of blood cells are produced in red marrow."},
  {"id":"FN20","topic":"functions","format":"mc","src":"SG9",
   "prompt":"Which function is explained by \"bones surround vital organs, such as our brain or heart\"?",
   "options":["Protection","Support","Anchorage","Hormone production"],
   "explain":"Protection: bones surround and protect vital organs such as the brain and heart."},

  {"id":"FN21","topic":"functions","format":"sata","src":"SG9",
   "prompt":"Which of these are among the 7 functions of bone?",
   "options":["Support","Protection","Anchorage","Mineral storage","Bone remodeling","Ossification"],
   "answer":["Support","Protection","Anchorage","Mineral storage"],
   "explain":"The 7 functions are support, protection, anchorage, mineral storage, blood cell formation, fat storage, and hormone production; remodeling and ossification are not on the list."},
  {"id":"FN22","topic":"functions","format":"sata","src":"SG9",
   "prompt":"Which of these are among the 7 functions of bone?",
   "options":["Blood cell formation","Fat storage","Hormone production","Reduction","Bone remodeling"],
   "answer":["Blood cell formation","Fat storage","Hormone production"],
   "explain":"Blood cell formation, fat storage, and hormone production are three of the 7 functions of bone; reduction and remodeling are not on the list."},
  {"id":"FN23","topic":"functions","format":"sata","src":"BB Protection",
   "prompt":"Which organs are protected by the ribcage?",
   "options":["Heart","Lungs","Brain","Spinal cord","Reproductive organs"],
   "answer":["Heart","Lungs"],
   "explain":"The ribcage protects the heart and lungs."},
  {"id":"FN24","topic":"functions","format":"sata","src":"BB Mineral Storage",
   "prompt":"Which minerals are stored in bone?",
   "options":["Calcium","Phosphate","Iron","Sodium"],
   "answer":["Calcium","Phosphate"],
   "explain":"Bones are reservoirs for calcium and phosphate."},
  {"id":"FN25","topic":"functions","format":"sata","src":"SG Long Bone rows",

  {"id":"AX01","topic":"axial","format":"mc","src":"BB Divisions",

   "options":["Appendicular skeleton","Axial skeleton","Vertebral column","Ribcage"],

   "explain":"The study guide marks the clavicle (collar bone) as appendicular."},
  {"id":"AX09","topic":"axial","format":"mc","src":"SG14",
   "prompt":"The mandible (lower jawbone) belongs to which division of the skeleton?",

   "prompt":"Which of these is NOT part of the axial skeleton?",

  /* ───────────────── 5. BONE CELLS & REMODELING ───────────────── */
  {"id":"CE01","topic":"cells","format":"mc","src":"FR Essential Qs",
   "prompt":"Which type of bone cell builds new bone?",
   "options":["Osteoblasts","Osteoclasts","Osteocytes","Osteogenic cells"],
   "explain":"Osteoblasts build new bone by creating osteoid."},
  {"id":"CE02","topic":"cells","format":"mc","src":"FR Essential Qs",
   "prompt":"Which type of bone cell cleans away old bone?",
   "options":["Osteoclasts","Osteoblasts","Osteocytes","Osteogenic cells"],
   "explain":"Osteoclasts clean away old bone (\"bone break\")."},
  {"id":"CE03","topic":"cells","format":"mc","src":"FR Essential Qs",
   "prompt":"Which type of cell forms when osteoblasts become buried?",
   "options":["Osteocytes","Osteoclasts","Osteogenic cells","Chondrocytes"],
   "explain":"Osteoblasts get buried and become osteocytes, the mature bone cells."},
  {"id":"CE04","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell can do mitosis?",
   "options":["Osteogenic cells","Osteoblasts","Osteocytes","Osteoclasts"],
   "explain":"Osteogenic cells are stem cells that can do mitosis."},
  {"id":"CE05","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell creates osteoid (the matrix of bone)?",
   "options":["Osteoblasts","Osteoclasts","Osteocytes","Osteogenic cells"],
   "explain":"Osteoblasts create osteoid, the matrix of bone."},
  {"id":"CE06","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell is considered a \"mature\" bone cell that lets bones perform their daily functions?",
   "options":["Osteocytes","Osteoblasts","Osteoclasts","Osteogenic cells"],
   "explain":"Osteocytes are the mature bone cells that allow bones to perform their daily functions."},
  {"id":"CE07","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell translates into \"bone break\"?",
   "options":["Osteoclast","Osteoblast","Osteocyte","Osteogenic cell"],
   "explain":"Osteoclast translates into \"bone break\"; they shave away old bone."},
  {"id":"CE08","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell translates into \"bone cell\"?",
   "options":["Osteocyte","Osteoblast","Osteoclast","Osteogenic cell"],
   "explain":"Osteocyte translates into \"bone cell\"; they are the mature bone cells."},
  {"id":"CE09","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell translates into \"bone produce\"?",
   "options":["Osteogenic cells","Osteoblasts","Osteocytes","Osteoclasts"],
   "explain":"Osteogenic translates into \"bone produce\"; these stem cells produce osteoblasts."},
  {"id":"CE10","topic":"cells","format":"mc","src":"FR Essential Qs (word root)",
   "prompt":"Which word root means \"blood\"?",
   "options":["Hema","Osteo","Chondro","Endo"],
   "explain":"Hema means blood, as in hematoma (blood clot) and hematopoiesis (blood cell production)."},
  {"id":"CE11","topic":"cells","format":"mc","src":"FR Essential Qs; SG7",

   "explain":"The matrix of bone is called osteoid."},
  {"id":"CE12","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell is in the periosteum and endosteum (don't pick osteogenic cells)?",
   "options":["Osteoclast","Osteoblast","Osteocyte","Chondrocyte"],
   "explain":"The key places osteoclasts in the periosteum and endosteum."},
  {"id":"CE13","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell is in the epiphyseal plates and on the periosteum?",
   "options":["Osteoblast","Osteoclast","Osteocyte","Osteogenic cell"],
   "explain":"Osteoblasts are in the epiphyseal plates (growth in length) and on the periosteum (growth in width)."},
  {"id":"CE14","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell is located inside the spongy bone AND compact bone?",
   "options":["Osteocyte","Osteoblast","Osteoclast","Osteogenic cell"],
   "explain":"Osteocytes are located inside the spongy bone and compact bone."},
  {"id":"CE15","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell removes dead bone after a fracture?",

   "explain":"Osteoclasts remove dead bone after a fracture."},
  {"id":"CE16","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell shaves away old bone when your bones are growing wider?",
   "options":["Osteoclast","Osteoblast","Osteocyte","Osteogenic cell"],
   "explain":"Osteoclasts shave away old bone when bones are growing wider."},
  {"id":"CE17","topic":"cells","format":"mc","src":"SG Cells table",
   "prompt":"Which type of bone cell creates osteoblasts?",
   "options":["Osteogenic cells","Osteocytes","Osteoclasts","Chondrocytes"],
   "explain":"Osteogenic cells are the stem cells that create osteoblasts."},
  {"id":"CE18","topic":"cells","format":"mc","src":"SG Cells 5",
   "prompt":"What is bone remodeling?",
   "options":["Removing old, worn-out bone and replacing it with new healthy bone","The formation of bone from a hyaline cartilage model before birth","The realignment of broken bone ends by a doctor's hands or surgery","The storage of calcium and phosphate to release into the blood"],
   "explain":"Bone remodeling is the removal of old, damaged, worn-out bone and replacing it with new healthy bone."},
  {"id":"CE19","topic":"cells","format":"mc","src":"SG Cells 6",
   "prompt":"Why is bone remodeling necessary?",
   "options":["So that our bones do not become brittle and break","So that our bones can store more fat","So that our bones stop growing","So that our bones become lighter every year"],
   "explain":"Bone remodeling is necessary so that our bones do not become brittle and break."},
  {"id":"CE20","topic":"cells","format":"mc","src":"SG Cells 7",
   "prompt":"How often is the skeleton fully replaced by bone remodeling?",
   "options":["Every 10 years","Every year","Every 25 years","Every 6 to 8 weeks"],
   "explain":"The skeleton is fully replaced by bone remodeling every 10 years."},
  {"id":"CE21","topic":"cells","format":"mc","src":"SG Cells 2",
   "prompt":"Why are osteoblasts located within the epiphyseal plates?",
   "options":["To build new bone so our bones grow in length","To build new bone so our bones grow in width","To shave away bone and widen the medullary cavity","To store calcium for later use"],
   "explain":"Osteoblasts in the epiphyseal plates build new bone to let bones grow in length."},
  {"id":"CE22","topic":"cells","format":"mc","src":"SG Cells 2",
   "prompt":"Why are osteoblasts located on the periosteum?",
   "options":["To build new bone so our bones grow wider","To build new bone so our bones grow in length","To remove dead bone after a fracture","To produce blood cells"],
   "explain":"Osteoblasts on the periosteum build new bone to make bones wider (also for fracture repair and remodeling)."},
  {"id":"CE23","topic":"cells","format":"mc","src":"SG Cells 3",
   "prompt":"Why are osteoclasts located within the endosteum?",
   "options":["To shave away bone so the medullary cavity widens and bones aren't too heavy","To build new bone so the bones grow in length at the growth plates","To lay down osteoid so the bones grow wider from the inside","To produce red blood cells, white blood cells, and platelets"],
   "explain":"Osteoclasts on the endosteum shave away bone to widen the medullary cavity, which keeps bones from becoming too heavy."},
  {"id":"CE24","topic":"cells","format":"mc","src":"FR Essential Qs",
   "prompt":"What are cartilage cells called?",
   "options":["Chondrocytes","Osteocytes","Osteoblasts","Osteoclasts"],
   "explain":"Cartilage cells are called chondrocytes."},
  {"id":"CE25","topic":"cells","format":"mc","src":"SG6",
   "prompt":"Bone belongs to which of the 4 major types of tissue?",
   "options":["Connective tissue","Muscle tissue","Nervous tissue","Epithelial tissue"],
   "explain":"Bone is a type of connective tissue with a matrix called osteoid."},
  {"id":"CE26","topic":"cells","format":"mc","src":"SG Cells 8",
   "prompt":"During remodeling, after osteoclasts shave away old bone, what do osteoblasts do?",
   "options":["Lay down osteoid to replace it with new bone","Do mitosis to make more osteoclasts","Dissolve the medullary cavity","Turn into chondrocytes"],
   "explain":"Osteoblasts replace the old worn-out bone with new bone by laying down osteoid, then bury themselves and become osteocytes."},
  {"id":"CE27","topic":"cells","format":"mc","src":"SG Cells 3",
   "prompt":"Why are osteoclasts located on the periosteum?",
   "options":["To clean away old bone during bone remodeling or fracture repair","To build new bone on the outside so the bones grow wider","To become buried in osteoid and turn into osteocytes","To produce the hormone osteocalcin for many body processes"],
   "explain":"On the periosteum, osteoclasts clean away old bone during bone remodeling or fracture repair."},
  {"id":"CE28","topic":"cells","format":"mc","src":"SG Cells 4",
   "prompt":"How do osteogenic cells become osteoblasts?",
   "options":["They undergo mitosis","They get buried in osteoid","They dissolve old bone","They absorb calcium"],
   "explain":"Osteogenic cells undergo mitosis and become osteoblasts because they are stem cells."},

   "explain":"An open reduction is also called an internal reduction."},

(function () {

  // ---------- persistence (localStorage, best effort) ----------

  function addMissed(id) { if (!progress.missed.includes(id)) { progress.missed.push(id); save(); } }
  function removeMissed(id) { const i = progress.missed.indexOf(id); if (i >= 0) { progress.missed.splice(i, 1); save(); } }

  // ---------- helpers ----------
  function shuffle(arr) {

    return a;

  function h(tag, attrs, ...children) {

      if (k === 'class') el.className = attrs[k];

      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k === 'disabled') { if (attrs[k]) el.setAttribute('disabled', ''); }
      else el.setAttribute(k, attrs[k]);
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(x => x != null && el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x));
      else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);

  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  // Draw n items from a topic in mixed formats: round-robin across formats so every set mixes them.
  // "Name this bone" items (skill: identify) are capped so a set mostly tests the topic itself.
  function drawFromTopic(topicKey, n, idCap) {
    const cap = idCap == null ? Infinity : idCap;
    const groups = {};
    ITEMS.filter(it => it.topic === topicKey).forEach(it => { (groups[it.format] = groups[it.format] || []).push(it); });
    const order = shuffle(Object.keys(groups));
    const queues = {}; order.forEach(f => { queues[f] = shuffle(groups[f]); });
    const out = [];
    let ids = 0, guard = 0;
    const take = f => {
      while (queues[f].length) {
        const it = queues[f].shift();
        if (it.skill === 'identify') { if (ids >= cap) continue; ids++; }
        out.push(it); return true;
      }
      return false;
    };
    while (out.length < n && guard++ < 1000) {
      let any = false;
      for (const f of order) { if (out.length < n && take(f)) any = true; }
      if (!any) break;
    }
    return shuffle(out);
  }

  // ---------- long bone diagram (original SVG) ----------

  // ---------- grading ----------
  function grade(item, answer) {
    if (item.format === 'mc') return answer === item.options[0];
    if (item.format === 'sata') return sameSet(answer, item.answer);
    if (item.format === 'match') return item.pairs.every(([t, d]) => answer[t] === d);
    if (item.format === 'sort') return item.tiles.every(([tile, box]) => answer[tile] === box);
    return false;
  }
  function correctText(item) {
    if (item.format === 'mc') return item.options[0];
    if (item.format === 'sata') return item.answer.join('; ');
    if (item.format === 'match') return item.pairs.map(([t, d]) => `${t} → ${d}`).join('; ');
    if (item.format === 'sort') return item.boxes.map(b => `${b}: ${item.tiles.filter(t => t[1] === b).map(t => t[0]).join(', ')}`).join(' | ');
    return '';
  }
  function answerText(item, answer) {
    if (answer == null) return '(no answer)';
    if (item.format === 'mc') return answer;
    if (item.format === 'sata') return answer.length ? answer.join('; ') : '(nothing selected)';
    if (item.format === 'match') return item.pairs.map(([t]) => `${t} → ${answer[t] || '?'}`).join('; ');
    if (item.format === 'sort') return item.tiles.map(([tile]) => `${tile} → ${answer[tile] || '?'}`).join('; ');
    return '';
  }

  // ---------- DOM refs ----------
  const $ = id => document.getElementById(id);
  const screens = { home: $('home'), quiz: $('quiz'), results: $('results') };
  function show(name) {
    for (const k in screens) screens[k].hidden = (k !== name);
    $('modeTag').textContent = name === 'home' ? '' : (session ? modeLabel() : '');

  }

  // ---------- session ----------
  let session = null;
  function modeLabel() {
    if (!session) return '';
    if (session.mode === 'topic') return topicName(session.topic);
    if (session.mode === 'missed') return 'Missed Questions';
    return 'Practice Test';
  }

  function startTopic(key) {
    const queue = drawFromTopic(key, SET_SIZE, BANK.identifyCap.set);
    session = { mode: 'topic', topic: key, queue, index: 0, results: [], retry: [], firstCount: queue.length };
    show('quiz'); renderQuestion();
  }
  function startMissed() {
    const ids = shuffle(progress.missed);
    const queue = ids.map(id => byId[id]);
    if (!queue.length) return;
    session = { mode: 'missed', queue, index: 0, results: [], retry: [], firstCount: queue.length };
    show('quiz'); renderQuestion();
  }
  function startTest() {
    let queue = [];
    for (const key in BANK.testAllocation) queue = queue.concat(drawFromTopic(key, BANK.testAllocation[key], BANK.identifyCap.test));
    queue = shuffle(queue).slice(0, TEST_SIZE);
    session = { mode: 'test', queue, index: 0, results: [], retry: [], firstCount: queue.length };
    show('quiz'); renderQuestion();
  }

  // ---------- question rendering ----------
  const INSTR = {
    mc: 'Tap one answer.',
    sata: 'Select all that apply. Then tap Check.',
    match: 'Tap a term, then tap its match. When all are paired, tap Check.',
    sort: 'Tap a tile, then tap a box. When all tiles are placed, tap Check.'
  };

  function renderQuestion() {
    const item = session.queue[session.index];
    const isRetry = session.index >= session.firstCount;
    const root = screens.quiz; clear(root);
    const total = session.queue.length;
    root.appendChild(h('div', { class: 'qhead' },
      h('span', null, h('span', { class: 'n' }, `Question ${session.index + 1} of ${total}`), session.mode === 'topic' ? ` · ${topicName(item.topic)}` : ` · ${topicName(item.topic)}`),
      h('span', null, `${item.format === 'mc' ? 'Multiple choice' : item.format === 'sata' ? 'Select all' : item.format === 'match' ? 'Matching' : 'Sort'}`)
    ));
    root.appendChild(h('div', { class: 'progress' }, h('div', { style: `width:${(session.index / total) * 100}%` })));
    if (isRetry) root.appendChild(h('span', { class: 'retry-note' }, 'Try again — you missed this one earlier in this set'));
    root.appendChild(h('p', { class: 'instruction' }, INSTR[item.format] + (session.mode === 'test' && item.format === 'mc' ? ' Then tap Next.' : '')));

    const area = h('div');
    root.appendChild(area);
    const actions = h('div', { class: 'actions' });
    root.appendChild(actions);
    const fbHolder = h('div');

    const ctl = { getAnswer: () => null, complete: () => false, markFeedback: () => {} };
    const checkBtn = h('button', { class: 'primary', disabled: true, onclick: () => submit() }, session.mode === 'test' ? 'Next' : 'Check');
    const refresh = () => { checkBtn.disabled = !ctl.complete(); };

    if (item.format === 'mc') renderMC(item, area, ctl, refresh, () => submit());

    // MC in practice mode submits on tap; everything else uses the Check/Next button.
    if (!(item.format === 'mc' && session.mode !== 'test')) actions.appendChild(checkBtn);

    let submitted = false;
    function submit() {
      if (submitted) return; submitted = true;
      const answer = ctl.getAnswer();
      const correct = grade(item, answer);
      checkBtn.remove();
      ctl.lock();
      if (session.mode === 'test') { record(item, correct, answer, isRetry); next(); return; }
      record(item, correct, answer, isRetry);
      ctl.markFeedback(answer);
      const fb = h('div', { class: 'feedback ' + (correct ? 'good' : 'bad') },
        h('p', { class: 'verdict' }, correct ? 'Correct!' : 'Not quite.'),
        correct ? null : h('p', null, 'Correct answer: ', h('span', { class: 'ans' }, correctText(item))),
        h('p', null, item.explain));
      const detail = ctl.feedbackDetail ? ctl.feedbackDetail(answer) : null;
      if (detail) fb.appendChild(detail);
      fbHolder.appendChild(fb);
      const nextBtn = h('button', { class: 'primary', onclick: next }, 'Next');
      actions.appendChild(nextBtn);
      nextBtn.focus({ preventScroll: true });
      nextBtn.scrollIntoView({ block: 'nearest' });
    }
  }

  function record(item, correct, answer, isRetry) {
    if (!isRetry) {
      session.results.push({ item, correct, answer });
      if (!correct) {
        addMissed(item.id);
        if (session.mode !== 'test') session.retry.push(item);
      } else if (session.mode === 'missed') {

  }

  function next() {
    session.index++;
    if (session.index >= session.queue.length) {
      if (session.retry.length && session.mode !== 'test') {
        session.queue = session.queue.concat(shuffle(session.retry));
        session.retry = [];
        renderQuestion();
        return;
      }
      finish();
      return;
    }
    renderQuestion();
  }

  // ----- Multiple choice -----
  function renderMC(item, area, ctl, refresh, onTap) {
    const opts = shuffle(item.options);
    const list = h('div', { class: 'options' });
    let chosen = null, locked = false;
    const btns = opts.map(o => {
      const b = h('button', { class: 'opt radio', onclick: () => {
        if (locked) return;
        chosen = o;
        btns.forEach(x => x.classList.toggle('selected', x.dataset.v === o));
        refresh();
        if (session.mode !== 'test') onTap();
      } }, h('span', { class: 'box' }), h('span', { class: 'lbl' }, o));
      b.dataset.v = o; return b;
    });
    btns.forEach(b => list.appendChild(b));
    area.appendChild(list);
    ctl.getAnswer = () => chosen;
    ctl.complete = () => chosen != null;
    ctl.lock = () => { locked = true; btns.forEach(b => b.setAttribute('disabled', '')); };
    ctl.markFeedback = () => {
      btns.forEach(b => {
        b.classList.remove('selected');
        if (b.dataset.v === item.options[0]) { b.classList.add('right'); b.appendChild(h('span', { class: 'note' }, '✓ correct')); }
        else if (b.dataset.v === chosen) { b.classList.add('wrong'); b.appendChild(h('span', { class: 'note' }, '✗ your pick')); }
      });
    };
  }

  // ----- Select all that apply -----
  function renderSATA(item, area, ctl, refresh) {
    const opts = shuffle(item.options);
    const list = h('div', { class: 'options' });
    const picked = new Set(); let locked = false;
    const btns = opts.map(o => {
      const b = h('button', { class: 'opt', 'aria-pressed': 'false', onclick: () => {
        if (locked) return;
        if (picked.has(o)) picked.delete(o); else picked.add(o);
        b.classList.toggle('selected', picked.has(o)); b.setAttribute('aria-pressed', String(picked.has(o)));
        b.querySelector('.box').textContent = picked.has(o) ? '✓' : '';
        refresh();
      } }, h('span', { class: 'box' }), h('span', { class: 'lbl' }, o));
      b.dataset.v = o; return b;
    });
    btns.forEach(b => list.appendChild(b));
    area.appendChild(list);
    ctl.getAnswer = () => Array.from(picked);
    ctl.complete = () => picked.size > 0;
    ctl.lock = () => { locked = true; btns.forEach(b => b.setAttribute('disabled', '')); };
    ctl.markFeedback = () => {
      btns.forEach(b => {
        const v = b.dataset.v, shouldBe = item.answer.includes(v), was = picked.has(v);
        b.classList.remove('selected');
        if (shouldBe && was) { b.classList.add('right'); b.appendChild(h('span', { class: 'note' }, '✓ right')); }
        else if (!shouldBe && was) { b.classList.add('wrong'); b.appendChild(h('span', { class: 'note' }, '✗ should not be selected')); }
        else if (shouldBe && !was) { b.classList.add('missed-opt'); b.querySelector('.box').textContent = '✓'; b.appendChild(h('span', { class: 'note' }, '✓ you missed this one')); }
        else { b.appendChild(h('span', { class: 'note' }, '✓ right (left blank)')); b.querySelector('.note').classList.add('ok'); }
      });
    };
  }

  // ----- Matching -----
  function renderMatch(item, area, ctl, refresh) {
    const terms = shuffle(item.pairs.map(p => p[0]));
    const defs = shuffle(item.pairs.map(p => p[1]));
    const pairs = {};       // term -> def
    let selTerm = null, selDef = null, locked = false;
    const termBtns = {}, defBtns = {};
    const wrap = h('div', { class: 'match' });
    const colT = h('div', { class: 'col' }, h('div', { class: 'col-title' }, 'Terms'));
    const colD = h('div', { class: 'col' }, h('div', { class: 'col-title' }, 'Matches'));
    terms.forEach(t => {
      const b = h('button', { class: 'chip', onclick: () => { if (locked) return; selTerm = (selTerm === t) ? null : t; tryPair(); paint(); } },
        h('span', { class: 'badge' }, ''), h('span', { class: 'lbl' }, t));
      termBtns[t] = b; colT.appendChild(b);
    });
    defs.forEach(d => {
      const b = h('button', { class: 'chip', onclick: () => { if (locked) return; selDef = (selDef === d) ? null : d; tryPair(); paint(); } },
        h('span', { class: 'badge' }, ''), h('span', { class: 'lbl' }, d));
      defBtns[d] = b; colD.appendChild(b);
    });
    wrap.appendChild(colT); wrap.appendChild(colD);
    area.appendChild(wrap);
    const tools = h('div', { class: 'tools' },
      h('button', { class: 'small-btn', onclick: () => { if (locked) return; for (const k in pairs) delete pairs[k]; selTerm = selDef = null; paint(); } }, 'Clear pairs'),
      h('span', { class: 'hint' }, 'Paired items share the same number.'));
    area.appendChild(tools);

    function tryPair() {
      if (selTerm != null && selDef != null) {
        for (const k in pairs) if (pairs[k] === selDef) delete pairs[k];   // a match can belong to one term only
        pairs[selTerm] = selDef;
        selTerm = selDef = null;
      }
      refresh();
    }
    function paint() {
      const order = Object.keys(pairs); // numbering in pairing order
      for (const t in termBtns) {
        const b = termBtns[t]; const idx = order.indexOf(t);
        b.classList.toggle('selected', selTerm === t);
        b.classList.toggle('paired', idx >= 0);
        b.querySelector('.badge').textContent = idx >= 0 ? String(idx + 1) : '';
      }
      for (const d in defBtns) {
        const b = defBtns[d]; const t = order.find(k => pairs[k] === d); const idx = t ? order.indexOf(t) : -1;
        b.classList.toggle('selected', selDef === d);
        b.classList.toggle('paired', idx >= 0);
        b.querySelector('.badge').textContent = idx >= 0 ? String(idx + 1) : '';
      }
    }
    ctl.getAnswer = () => Object.assign({}, pairs);
    ctl.complete = () => item.pairs.every(([t]) => pairs[t] != null);
    ctl.lock = () => { locked = true; Object.values(termBtns).concat(Object.values(defBtns)).forEach(b => b.setAttribute('disabled', '')); tools.remove(); };
    ctl.markFeedback = () => {
      item.pairs.forEach(([t, d]) => {
        const ok = pairs[t] === d;
        termBtns[t].classList.add(ok ? 'right' : 'wrong');
        if (pairs[t] != null) defBtns[pairs[t]].classList.add(ok ? 'right' : 'wrong');
      });
    };
    ctl.feedbackDetail = () => h('ul', null, item.pairs.map(([t, d]) => {
      const ok = pairs[t] === d;
      return h('li', null, h('span', { class: ok ? 'ok' : 'no' }, ok ? '✓ ' : '✗ '), `${t} → ${pairs[t] || '?'}`, ok ? '' : h('span', null, ' — should be: ', h('b', null, d)));
    }));
  }

  // ----- Sort into boxes -----
  function renderSort(item, area, ctl, refresh) {
    const tiles = shuffle(item.tiles.map(t => t[0]));
    const placed = {};  // tile -> box
    let sel = null, locked = false;
    const pool = h('div', { class: 'pool', role: 'group', 'aria-label': 'Tiles to sort', onclick: e => {
      if (locked) return;
      if (e.target === pool && sel && placed[sel]) { delete placed[sel]; sel = null; paint(); }
    } });
    const boxesEl = h('div', { class: 'boxes' + (item.boxes.length === 2 ? ' two' : '') });
    const boxEls = {};
    item.boxes.forEach(b => {
      const el = h('div', { class: 'dropbox', role: 'button', tabindex: '0', onclick: () => place(b) },
        h('div', { class: 'box-title' }, b), h('div', { class: 'box-tiles' }));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); place(b); } });
      boxEls[b] = el; boxesEl.appendChild(el);
    });
    const tileEls = {};
    tiles.forEach(t => {
      const el = h('button', { class: 'tile', onclick: e => {
        e.stopPropagation(); if (locked) return;
        // A selected tile tapped onto a tile already sitting in a box goes into that box.
        if (sel && sel !== t && placed[t]) { place(placed[t]); return; }
        sel = (sel === t) ? null : t; paint();
      } }, t);
      tileEls[t] = el;
    });
    area.appendChild(h('p', { class: 'hint', style: 'margin:0 0 6px' }, 'Tiles'));
    area.appendChild(pool);
    area.appendChild(boxesEl);

    function place(box) {
      if (locked || !sel) return;
      placed[sel] = box; sel = null; paint(); refresh();
    }
    function paint() {
      clear(pool);
      for (const b in boxEls) clear(boxEls[b].querySelector('.box-tiles'));
      tiles.forEach(t => {
        const el = tileEls[t];
        el.classList.toggle('selected', sel === t);
        if (placed[t]) boxEls[placed[t]].querySelector('.box-tiles').appendChild(el); else pool.appendChild(el);
      });
      pool.classList.toggle('empty', tiles.every(t => placed[t]));
      for (const b in boxEls) boxEls[b].classList.toggle('target', !!sel);
    }
    paint();
    ctl.getAnswer = () => Object.assign({}, placed);
    ctl.complete = () => tiles.every(t => placed[t]);
    ctl.lock = () => { locked = true; tiles.forEach(t => tileEls[t].setAttribute('disabled', '')); for (const b in boxEls) { boxEls[b].classList.remove('target'); boxEls[b].removeAttribute('tabindex'); } };
    ctl.markFeedback = () => {
      item.tiles.forEach(([t, box]) => {
        const ok = placed[t] === box;
        tileEls[t].classList.add(ok ? 'right' : 'wrong');
        if (!ok) tileEls[t].appendChild(h('span', { class: 'fix' }, `→ ${box}`));
      });
    };
  }

  // ---------- finishing ----------
  function finish() {
    const r = session.results;
    const correct = r.filter(x => x.correct).length;
    const total = r.length;
    if (session.mode === 'topic') { progress.scores[session.topic] = { correct, total }; save(); }
    if (session.mode === 'test') { progress.test = { correct, total }; save(); }
    const root = screens.results; clear(root);
    const pct = total ? Math.round((correct / total) * 100) : 0;
    root.appendChild(h('h1', null, session.mode === 'test' ? 'Practice Test results' : session.mode === 'missed' ? 'Missed Questions round done' : `${topicName(session.topic)}: set complete`));
    root.appendChild(h('div', { class: 'score-card' },
      h('div', { class: 'big' }, `${correct} / ${total}`),
      h('div', { class: 'sub' }, `${pct}% on first try` + (session.mode === 'missed' ? ` · ${progress.missed.length} still in Missed Questions` : ''))));

    if (session.mode === 'test') {
      const perTopic = {};
      r.forEach(x => { const k = x.item.topic; perTopic[k] = perTopic[k] || { c: 0, t: 0 }; perTopic[k].t++; if (x.correct) perTopic[k].c++; });
      const table = h('table', { class: 'per-topic' }, h('thead', null, h('tr', null, h('th', null, 'Topic'), h('th', null, 'Score'))),
        h('tbody', null, TOPICS.filter(t => perTopic[t.key]).map(t => h('tr', null, h('td', null, t.name), h('td', null, `${perTopic[t.key].c} / ${perTopic[t.key].t}`)))));
      root.appendChild(h('h2', null, 'Score by topic'));
      root.appendChild(table);
      const wrong = r.filter(x => !x.correct);
      root.appendChild(h('h2', null, wrong.length ? `Review your ${wrong.length} wrong answer${wrong.length === 1 ? '' : 's'}` : 'No wrong answers. Nice work.'));
      if (wrong.length) root.appendChild(h('p', { class: 'lead' }, 'These were added to Missed Questions.'));
      const list = h('div', { class: 'review' });
      wrong.forEach(x => {
        list.appendChild(h('div', { class: 'review-item' },
          h('div', { class: 'tp' }, topicName(x.item.topic)),
          h('div', { class: 'q' }, x.item.prompt),
          x.item.img === 'longbone' ? h('div', { class: 'diagram', html: diagramSVG() }) : null,
          h('p', null, h('span', { class: 'no' }, 'Your answer: '), answerText(x.item, x.answer)),
          h('p', null, h('span', { class: 'ok' }, 'Correct answer: '), correctText(x.item)),
          h('p', null, x.item.explain)));
      });
      root.appendChild(list);
    }

    const actions = h('div', { class: 'actions' });
    if (session.mode === 'topic') actions.appendChild(h('button', { class: 'primary', onclick: () => startTopic(session.topic) }, 'Practice again'));
    if (session.mode === 'missed') actions.appendChild(h('button', { class: 'primary', disabled: progress.missed.length === 0, onclick: startMissed }, 'Practice again'));
    if (session.mode === 'test') actions.appendChild(h('button', { class: 'primary', onclick: startTest }, 'Take another test'));
    actions.appendChild(h('button', { class: 'ghost', onclick: goHome }, 'Home'));
    root.appendChild(actions);
    show('results');
  }

  // ---------- home ----------
  function goHome() { session = null; renderHome(); show('home'); }
  function renderHome() {
    const root = screens.home; clear(root);
    root.appendChild(h('h1', null, 'Bone Basics Study'));
    root.appendChild(h('p', { class: 'lead' }, 'Pick a topic. Each set is 10 questions with instant feedback. Anything you miss comes back at the end of the set and goes into Missed Questions.'));
    const grid = h('div', { class: 'topics' });
    TOPICS.forEach(t => {
      const s = progress.scores[t.key];
      const missedN = progress.missed.filter(id => byId[id].topic === t.key).length;
      grid.appendChild(h('button', { class: 'topic-btn', onclick: () => startTopic(t.key) },
        h('span', { class: 'name' }, t.name),
        h('span', { class: 'meta' },
          h('span', { class: 'score' }, s ? `Last score: ${s.correct}/${s.total}` : 'Not started'),
          missedN ? h('span', { class: 'pill missed' }, `${missedN} missed waiting`) : (s ? h('span', { class: 'pill clear' }, 'No missed questions') : (t.extra ? h('span', { class: 'pill extra' }, 'Optional') : null)))));
    });
    root.appendChild(grid);
    const n = progress.missed.length;
    const acts = h('div', { class: 'home-actions' },
      h('button', { class: 'big-btn secondary', disabled: n === 0, onclick: startMissed }, h('span', null, `Missed Questions (${n})`), h('span', { class: 'meta' }, n ? 'Drill only what you got wrong' : 'Nothing missed yet')),
      h('button', { class: 'big-btn', onclick: startTest }, h('span', null, 'Practice Test'), h('span', { class: 'meta' }, progress.test ? `Last: ${progress.test.correct}/${progress.test.total} · 30 questions, no feedback until the end` : '30 questions, no feedback until the end')));
    root.appendChild(acts);
    const resetRow = h('div', { class: 'reset-row' });
    const confirmBox = h('div', { class: 'confirm' }, h('span', null, 'Erase all scores and the Missed Questions list?'),
      h('button', { class: 'small-btn danger', onclick: () => { progress = freshProgress(); save(); renderHome(); } }, 'Yes, reset'),
      h('button', { class: 'small-btn', onclick: () => { confirmBox.hidden = true; } }, 'Cancel'));
    confirmBox.hidden = true;
    resetRow.appendChild(h('button', { class: 'link-btn', onclick: () => { confirmBox.hidden = !confirmBox.hidden; } }, 'Reset progress'));
    resetRow.appendChild(confirmBox);
    root.appendChild(resetRow);
  }

  // ---------- boot ----------
  $('homeLink').addEventListener('click', goHome);
  load();
  renderHome();
  show('home');

  // exposed for automated testing only
  window.__bb = { BANK, grade, drawFromTopic, getProgress: () => progress, getSession: () => session };
})();

</script>
</body>
</html>
