<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skeletal System Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered column (max 720px), big tap targets, one instruction line above each question.
   Palette: warm paper + periwinkle accent (echoes the course slides); semantic green/red for grading. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #efece4;
  --ink: #1e1c19;
  --muted: #655f56;
  --line: #d9d3c6;
  --accent: #5457c0;
  --accent-ink: #ffffff;
  --accent-soft: #e4e5f8;
  --good: #1f7a46;
  --good-bg: #e3f3e8;
  --bad: #b2271d;
  --bad-bg: #fbe7e4;
  --warn-bg: #fff3d6;
  --warn: #8a5a00;
  --bone: #efe2cc;
  --bone-edge: #8a6d4e;
  --shadow: 0 1px 2px rgba(30,28,25,.06), 0 4px 14px rgba(30,28,25,.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161b; --surface: #1f2027; --surface-2: #2a2b34; --ink: #ecebf0; --muted: #a7a6b3; --line: #383944;
    --accent: #8f92f2; --accent-ink: #101120; --accent-soft: #2b2d4d;
    --good: #6fd198; --good-bg: #17301f; --bad: #ff9a8f; --bad-bg: #3b1f1b; --warn-bg: #3a2f14; --warn: #ffd27a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161b; --surface: #1f2027; --surface-2: #2a2b34; --ink: #ecebf0; --muted: #a7a6b3; --line: #383944;
  --accent: #8f92f2; --accent-ink: #101120; --accent-soft: #2b2d4d;
  --good: #6fd198; --good-bg: #17301f; --bad: #ff9a8f; --bad-bg: #3b1f1b; --warn-bg: #3a2f14; --warn: #ffd27a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; letter-spacing: .01em; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink); font-size: 17px; }
.brand:hover { color: var(--accent); }
.brand { white-space: nowrap; }
.tag { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 20px 48px; }
h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 4px; text-wrap: balance; }
h2 { font-size: 20px; margin: 20px 0 10px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 18px; }

/* Home */
.topics { display: grid; gap: 10px; margin: 0 0 18px; }
.topic-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  box-shadow: var(--shadow);
}
.topic-btn:hover { border-color: var(--accent); }
.topic-btn .name { font-weight: 700; font-size: 18px; }
.topic-btn .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.topic-btn .score { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.pill.missed { background: var(--bad-bg); color: var(--bad); }
.pill.clear { background: var(--good-bg); color: var(--good); }
.pill.extra { background: var(--surface-2); color: var(--muted); }
.big-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 16px 18px; border-radius: 12px; border: 0; cursor: pointer; font-size: 18px; font-weight: 700;
  background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
}
.big-btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.big-btn:disabled { opacity: .55; cursor: default; }
.big-btn .meta { font-size: 14px; font-weight: 500; opacity: .85; white-space: nowrap; }
.home-actions { display: grid; gap: 10px; }
.reset-row { margin-top: 28px; font-size: 14px; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }
.link-btn:hover { color: var(--bad); }
.confirm { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.small-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; }
.small-btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }

/* Quiz */
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.qhead .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.instruction { font-size: 14px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
.prompt { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 16px; text-wrap: pretty; }
.retry-note { display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
.diagram { background: #fffdf8; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 0 0 16px; }
.diagram svg { display: block; width: 100%; height: auto; max-width: 100%; }

.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; min-height: 52px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; line-height: 1.3;
}
.opt:hover { border-color: var(--accent); }
.opt .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.opt.radio .box { border-radius: 50%; }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.selected .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .box { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .box { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.missed-opt { border-color: var(--good); border-style: dashed; }
.opt.missed-opt .box { border-color: var(--good); color: var(--good); }
.opt[disabled] { cursor: default; }
.opt .lbl { flex: 1; min-width: 0; }
.opt .note { flex: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.opt.right .note { color: var(--good); } .opt.wrong .note { color: var(--bad); } .opt.missed-opt .note { color: var(--good); }
.opt .note.muted { color: var(--muted); font-weight: 600; }
.instruction .ok, .instruction .no { font-weight: 800; }
.key-btn[aria-pressed="true"] { border-color: var(--good); color: var(--good); }

/* Matching */
.match { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match .col-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.chip {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 10px; min-height: 48px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.25;
}
.chip .lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.chip .badge { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.chip.selected { border-color: var(--accent); background: var(--accent-soft); }
.chip.paired .badge { background: var(--accent); color: var(--accent-ink); }
.chip.right { border-color: var(--good); background: var(--good-bg); }
.chip.wrong { border-color: var(--bad); background: var(--bad-bg); }
.chip[disabled] { cursor: default; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.hint { font-size: 14px; color: var(--muted); }

/* Sorting */
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: 60px; border: 2px dashed var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; }
.pool.empty::after { content: "All tiles placed. Tap a tile in a box to move it back here."; color: var(--muted); font-size: 14px; }
.tile { padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.25; text-align: left; }
.tile.selected { border-color: var(--accent); background: var(--accent-soft); }
.tile.right { border-color: var(--good); background: var(--good-bg); }
.tile.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tile[disabled] { cursor: default; }
.boxes { display: grid; gap: 10px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.boxes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dropbox { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px; min-height: 110px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.dropbox.target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dropbox .box-title { font-weight: 700; font-size: 15px; color: var(--accent); }
.dropbox .box-tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.dropbox .box-tiles .tile { font-size: 14px; padding: 7px 10px; }
.tile .fix { display: block; font-size: 12px; color: var(--bad); font-weight: 600; }

/* Buttons + feedback */
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.primary { padding: 14px 24px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; cursor: pointer; min-width: 140px; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { padding: 14px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 17px; cursor: pointer; }
.feedback { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.feedback.good { border-color: var(--good); background: var(--good-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback .verdict { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
.feedback.good .verdict { color: var(--good); } .feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 4px 0; }
.feedback .ans { font-weight: 600; }
.feedback ul { margin: 6px 0 0; padding-left: 18px; }
.feedback li { margin: 3px 0; }
.ok { color: var(--good); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }

/* Results */
.score-card { text-align: center; padding: 24px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 16px; }
.score-card .big { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score-card .sub { color: var(--muted); margin-top: 6px; }
.per-topic { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: 15px; }
.per-topic th, .per-topic td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.per-topic td:last-child, .per-topic th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 12px; }
.review-item { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.review-item .tp { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.review-item .q { font-weight: 600; margin: 4px 0 8px; }
.review-item p { margin: 4px 0; font-size: 15px; }
.review-item .diagram { margin-top: 8px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
@media (max-width: 420px) {
  body { font-size: 16px; }
  .prompt { font-size: 18px; }
  .topic-btn { flex-direction: column; align-items: flex-start; }
  .topic-btn .meta { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .big-btn { flex-direction: column; align-items: flex-start; gap: 4px; }
}


/* Skull app additions */
.diagram { margin: 0 0 16px; text-align: center; }
.diagram svg { max-width: 460px; margin: 0 auto; }
.diagram figcaption { font-size: 13px; color: #6b6255; margin-top: 2px; }
figure.diagram { margin-left: 0; margin-right: 0; }
.explore-btn { margin-bottom: 4px; }
.version { margin-top: 18px; font-size: 13px; color: var(--muted); }
.bone-groups { display: grid; gap: 12px; margin-bottom: 14px; }
.bone-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.bone-chip { padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 600; }
.bone-chip.cranial { border-color: #8cc3e6; }
.bone-chip.facial { border-color: #e6cf6a; }
.bone-chip.on { background: #f0663a; border-color: #f0663a; color: #fff; }
.bone-card { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; min-height: 52px; }
.bone-card p { margin: 6px 0; }
.bone-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bone-name { font-weight: 800; font-size: 19px; margin-right: 4px; }
.pill.cranial { background: #d6ecfa; color: #1d5a82; }
.pill.facial { background: #fbf0bf; color: #6d5600; }
.views { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.explore-fig { margin: 0; }
.explore-fig [data-bone] { cursor: pointer; }
.explore-fig svg *:not([data-bone]):not(svg):not(g) { pointer-events: none; }


/* Skeletal app additions */
.hnum { font-weight: 700; color: var(--accent); margin-right: 4px; }
.fill-input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); box-sizing: border-box; }
.fill-input:focus { outline: none; border-color: var(--accent); }
.fill-input.right { border-color: var(--good); background: var(--good-bg); }
.fill-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.short-input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); box-sizing: border-box; resize: vertical; }
.feedback.model { border: 1px solid var(--line); background: var(--surface); }
.feedback.model ul { margin: 4px 0 8px; padding-left: 20px; }
.diagram svg { max-height: 56vh; width: auto; max-width: 100%; display: block; margin: 0 auto; }
.fig-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.fig-tab { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.fig-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.views.one { grid-template-columns: 1fr; }
.views.one .diagram svg { max-height: 78vh; }
.bone-chip { color: var(--ink); }
.big-btn .meta { white-space: normal; text-align: left; }
.big-btn { min-width: 0; }

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button id="homeLink" class="brand" type="button">Skeletal System Study</button>
  <span id="modeTag" class="tag"></span>
</div></header>
<main class="wrap">
  <section id="home" aria-label="Home"></section>
  <section id="explore" aria-label="Explore the bones" hidden></section>
  <section id="quiz" aria-label="Question" hidden></section>
  <section id="results" aria-label="Results" hidden></section>
</main>

  "items": [
    {"id": "Q01", "topic": "types", "format": "mc", "prompt": "Which type of bones are typically found embedded in tendons?", "options": ["Sesamoid bones", "Long bones", "Short bones", "Flat bones"], "explain": "Sesamoid bones are buried within tendons. The patella (kneecap) is one.", "num": 1},
    {"id": "Q02", "topic": "types", "format": "mc", "prompt": "What is the primary function of flat bones?", "options": ["Protect internal organs", "Enable movement", "Support tendons", "Aid in bearing weight"], "explain": "Flat bones (skull, sternum, ribs) protect internal organs like the brain, heart, and lungs.", "num": 2},
    {"id": "Q03", "topic": "types", "format": "mc", "prompt": "Which type of bone has two epiphyses and a hollow medullary cavity?", "options": ["Long bones", "Short bones", "Flat bones", "Irregular bones"], "explain": "A long bone has a long diaphysis (shaft), 2 epiphyses (ends), and a hollow medullary cavity inside.", "num": 3},
    {"id": "Q04", "topic": "types", "format": "mc", "prompt": "What type of bones are the clavicles classified as?", "options": ["Long bones", "Short bones", "Flat bones", "Irregular bones"], "explain": "The clavicle is a long bone: its length is greater than its width.", "num": 4},
    {"id": "Q05", "topic": "types", "format": "mc", "prompt": "The carpals are an example of which type of bone?", "options": ["Short bones", "Long bones", "Flat bones", "Sesamoid bones"], "explain": "Carpals (wrist) and tarsals (ankle) are short bones: roughly cube-shaped and grouped together.", "num": 5},
    {"id": "Q06", "topic": "types", "format": "mc", "prompt": "Which type of bones are roughly cube-shaped and grouped together?", "options": ["Short bones", "Irregular bones", "Long bones", "Sesamoid bones"], "explain": "Short bones are roughly cube-shaped and sit together in a group, like the carpals and tarsals.", "num": 6},
    {"id": "Q07", "topic": "types", "format": "mc", "prompt": "Which type of bone provides a lot of surface area for muscle attachment?", "options": ["Flat bones", "Long bones", "Irregular bones", "Short bones"], "explain": "Besides protecting organs, flat bones give muscles a large surface to attach to.", "num": 7},
    {"id": "Q08", "topic": "types", "format": "mc", "prompt": "The mandible is an example of which type of bone?", "options": ["Irregular", "Flat", "Long", "Sesamoid"], "explain": "The mandible has a complicated shape that doesn't fit the other categories, so it's an irregular bone (like the vertebrae).", "num": 8},
    {"id": "Q09", "topic": "types", "format": "mc", "prompt": "The patella is an example of which type of bone?", "options": ["Sesamoid", "Irregular", "Short", "Flat"], "explain": "The patella (kneecap) is a sesamoid bone: it forms inside a tendon.", "num": 9},
    {"id": "Q10", "topic": "types", "format": "mc", "prompt": "The phalanges are an example of which type of bone?", "options": ["Long", "Short", "Sesamoid", "Irregular"], "explain": "Phalanges are small, but each one is longer than it is wide, so they're long bones.", "num": 10},
    {"id": "TY-M1", "topic": "types", "format": "match", "prompt": "Match each bone type to its description.", "pairs": [["Long", "Length greater than width; 2 epiphyses"], ["Short", "Roughly cube-shaped; grouped together"], ["Flat", "Thin; protects organs; muscle attachment"], ["Irregular", "Complicated shape (vertebrae, mandible)"], ["Sesamoid", "Embedded in a tendon"]], "explain": "Long, short, flat, irregular, sesamoid: the 5 bone types."},
    {"id": "TY-M2", "topic": "types", "format": "match", "prompt": "Match each bone to its type.", "pairs": [["Clavicle", "Long"], ["Carpals", "Short"], ["Sternum", "Flat"], ["Mandible", "Irregular"], ["Patella", "Sesamoid"]], "explain": "Clavicle = long, carpals = short, sternum = flat, mandible = irregular, patella = sesamoid."},
    {"id": "TY-S1", "topic": "types", "format": "sort", "prompt": "Sort each bone into its type.", "boxes": ["Long", "Short", "Flat", "Irregular", "Sesamoid"], "tiles": [["Phalanges", "Long"], ["Femur", "Long"], ["Tarsals", "Short"], ["Ribs", "Flat"], ["Vertebrae", "Irregular"], ["Patella", "Sesamoid"]], "explain": "Phalanges and femur are long; tarsals are short; ribs are flat; vertebrae are irregular; the patella is sesamoid."},
    {"id": "Q11", "topic": "axial", "format": "mc", "prompt": "Which division of the skeleton includes bones near or on the midline?", "options": ["Axial skeleton", "Appendicular skeleton", "Peripheral skeleton", "Central skeleton"], "explain": "The axial skeleton is the bones on or near the midline: skull, vertebral column, ribcage (plus sternum and hyoid).", "num": 11},
    {"id": "Q12", "topic": "axial", "format": "mc", "prompt": "Which bones are considered part of the appendicular skeleton?", "options": ["Limbs & girdles", "Skull & vertebrae", "Sternum & pelvis", "Facial & cranial bones"], "explain": "The appendicular skeleton is the limbs plus the girdles that attach them to the trunk.", "num": 12},
    {"id": "Q13", "topic": "axial", "format": "mc", "prompt": "Which division of the skeleton includes the ribs?", "options": ["Axial skeleton", "Peripheral skeleton", "Central skeleton", "Appendicular skeleton"], "explain": "The ribs are part of the axial skeleton (with the sternum, they form the ribcage).", "num": 13},
    {"id": "Q14", "topic": "axial", "format": "mc", "prompt": "Which division of the skeleton includes the metatarsals?", "options": ["Appendicular skeleton", "Peripheral skeleton", "Central skeleton", "Axial skeleton"], "explain": "Metatarsals are foot bones, part of a limb, so they're appendicular.", "num": 14},
    {"id": "Q15", "topic": "axial", "format": "mc", "prompt": "Which division of the skeleton includes the pelvis?", "options": ["Appendicular skeleton", "Peripheral skeleton", "Central skeleton", "Axial skeleton"], "explain": "The pelvis (hip bones) is the pelvic girdle, which attaches the legs, so it's appendicular.", "num": 15},
    {"id": "Q16", "topic": "axial", "format": "mc", "prompt": "Which division of the skeleton includes the hyoid bone?", "options": ["Axial skeleton", "Peripheral skeleton", "Central skeleton", "Appendicular skeleton"], "explain": "The hyoid bone sits in the neck on the midline, so it's axial.", "num": 16},
    {"id": "AX-S1", "topic": "axial", "format": "sort", "prompt": "Sort each bone: axial or appendicular?", "boxes": ["Axial", "Appendicular"], "tiles": [["Ribs", "Axial"], ["Hyoid bone", "Axial"], ["Sternum", "Axial"], ["Sacrum", "Axial"], ["Metatarsals", "Appendicular"], ["Pelvis", "Appendicular"], ["Clavicle", "Appendicular"], ["Scapula", "Appendicular"]], "explain": "Midline bones are axial. Limbs and girdles (clavicle, scapula, pelvis) are appendicular."},
    {"id": "AX-S2", "topic": "axial", "format": "sort", "prompt": "Sort each bone: axial or appendicular?", "boxes": ["Axial", "Appendicular"], "tiles": [["Cranium", "Axial"], ["Mandible", "Axial"], ["Cervical vertebrae", "Axial"], ["Coccyx", "Axial"], ["Humerus", "Appendicular"], ["Carpals", "Appendicular"], ["Femur", "Appendicular"], ["Patella", "Appendicular"]], "explain": "The skull and spine are axial; arm and leg bones are appendicular."},
    {"id": "AX-1", "topic": "axial", "format": "mc", "prompt": "In the front-view skeleton, which bone is highlighted, and which division is it in?", "options": ["Sternum: axial", "Sternum: appendicular", "Clavicle: axial", "Clavicle: appendicular"], "explain": "The sternum (breastbone) is on the midline, so it's axial.", "img": {"fig": "front", "hi": "sternum", "crop": "upper"}},
    {"id": "AX-2", "topic": "axial", "format": "mc", "prompt": "In the front-view skeleton, which bone is highlighted, and which division is it in?", "options": ["Clavicle: appendicular", "Clavicle: axial", "Sternum: axial", "Scapula: appendicular"], "explain": "The clavicle is part of the pectoral (shoulder) girdle, which attaches the arm, so it's appendicular.", "img": {"fig": "front", "hi": "clavicle", "crop": "upper"}},
    {"id": "Q17", "topic": "skull", "format": "mc", "prompt": "How many bones are there in the human skull?", "options": ["22", "20", "24", "27"], "explain": "The skull has 22 bones: 8 cranial + 14 facial.", "num": 17},
    {"id": "Q18", "topic": "skull", "format": "mc", "prompt": "Which type of skull bones provide openings for food and air to enter?", "options": ["Facial bones", "Cranial bones", "Temporal bones", "Parietal bones"], "explain": "Facial bones make up the face, provide openings for air and food, and anchor the muscles of facial expression.", "num": 18},
    {"id": "Q19", "topic": "skull", "format": "mc", "prompt": "Which type of skull bones provide a protective casing for the brain?", "options": ["Cranial bones", "Facial bones", "Maxillae & mandible", "Appendicular bones"], "explain": "Cranial bones surround and protect the brain.", "num": 19},
    {"id": "Q20", "topic": "skull", "format": "mc", "prompt": "How many cranial bones are in the skull total (counting each bone separately)?", "options": ["8", "5", "10", "12"], "explain": "8 cranial bones: frontal, occipital, sphenoid, ethmoid (1 each) + parietal and temporal (2 each).", "num": 20},
    {"id": "Q21", "topic": "skull", "format": "mc", "prompt": "Which cranial bones occur in pairs?", "options": ["Temporal & parietal", "Ethmoid & sphenoid", "Mandible & vomer", "Frontal & occipital"], "explain": "Only the temporal and parietal bones come in pairs.", "num": 21},
    {"id": "Q22", "topic": "skull", "format": "mc", "prompt": "Which bone is a facial bone?", "options": ["Vomer bone", "Ethmoid bone", "Sphenoid bone", "Temporal bone"], "explain": "The vomer is a facial bone. Ethmoid, sphenoid, and temporal are cranial.", "num": 22},
    {"id": "Q23", "topic": "skull", "format": "mc", "prompt": "Which facial bones do you only have one of?", "options": ["Vomer bone & mandible", "Palatine bone & inferior nasal conchae", "Lacrimal bone & maxillae", "Nasal bone & zygomatic bone"], "explain": "The vomer and mandible are the only single facial bones; the other facial bones come in pairs.", "num": 23},
    {"id": "Q24", "topic": "skull", "format": "mc", "prompt": "What is the common name for the zygomatic bone?", "options": ["Cheekbone", "Jawbone", "Nose bridge", "Eye socket"], "explain": "The zygomatic bones are the cheekbones.", "num": 24},
    {"id": "Q25", "topic": "skull", "format": "mc", "prompt": "Which cranial bone/bones have condyles that form a joint with the atlas?", "options": ["Occipital bone", "Parietal bones", "Frontal bone", "Temporal bones"], "explain": "The occipital condyles (beside the foramen magnum) form a joint with the atlas, the first vertebra.", "num": 25},
    {"id": "Q26", "topic": "skull", "format": "mc", "prompt": "Which cranial bone is shaped like a butterfly?", "options": ["Sphenoid bone", "Palatine bone", "Ethmoid bone", "Temporal bone"], "explain": "The sphenoid is the butterfly-shaped \"keystone\" bone.", "num": 26},
    {"id": "Q27", "topic": "skull", "format": "mc", "prompt": "Which cranial bone makes up the top and side walls of the cranium?", "options": ["Parietal bones", "Frontal bone", "Temporal bones", "Occipital bone"], "explain": "Parietal = top and side walls. Temporal = bottom and side walls.", "num": 27},
    {"id": "Q28", "topic": "skull", "format": "mc", "prompt": "Which cranial bone is a deep bone that makes up a significant portion of the nasal cavity?", "options": ["Ethmoid bone", "Vomer bone", "Maxilla", "Sphenoid bone"], "explain": "The ethmoid is deep in the cranium and makes up much of the nasal cavity.", "num": 28},
    {"id": "Q29", "topic": "skull", "format": "mc", "prompt": "Which facial bone is originally two separate bones, but fuse by age 1?", "options": ["Mandible", "Vomer bone", "Nasal bone", "Palatine bone"], "explain": "The mandible is 2 separate bones at birth that fuse by age 1.", "num": 29},
    {"id": "Q30", "topic": "skull", "format": "mc", "prompt": "Which facial bone/bones form much of the upper jaw?", "options": ["Maxillae", "Mandible", "Zygomatic bones", "Temporal bones"], "explain": "The maxillae form much of the upper jaw. The mandible is the lower jaw.", "num": 30},
    {"id": "Q31", "topic": "skull", "format": "mc", "prompt": "Which nasal bone/bones form the posterior and inferior portion of the nasal septum?", "options": ["Vomer bone", "Palatine bone", "Ethmoid bone", "Zygomatic bones"], "explain": "The vomer forms the back and bottom of the nasal septum; the ethmoid forms the upper part.", "num": 31},
    {"id": "Q32", "topic": "skull", "format": "mc", "prompt": "Which bone/bones are the largest and strongest facial bone?", "options": ["Mandible", "Maxillae", "Zygomatic bones", "Lacrimal bones"], "explain": "The mandible is the largest and strongest facial bone.", "num": 32},
    {"id": "Q33", "topic": "skull", "format": "mc", "prompt": "The smallest facial bone/bones are the _____.", "options": ["Lacrimal bones", "Inferior nasal conchae", "Nasal bones", "Zygomatic bones"], "explain": "The lacrimal bones are the smallest facial bones, in the inner corner of each eye socket.", "num": 33},
    {"id": "Q34", "topic": "skull", "format": "mc", "prompt": "The temporal bone and mandible meet at the _____.", "options": ["Temporomandibular joint", "Mastoid process", "Orbit", "Occipital condyles"], "explain": "Temporo + mandibular: the TMJ is where the temporal bone and mandible meet.", "num": 34},
    {"id": "Q58", "topic": "skull", "format": "fill", "prompt": "The eye socket is also referred to as the _____.", "answers": ["orbit", "orbits"], "explain": "The eye socket is the orbit.", "num": 58},
    {"id": "Q59", "topic": "skull", "format": "fill", "prompt": "The _____ bone makes up the back and bottom walls of the cranium.", "answers": ["occipital"], "explain": "The occipital bone is the back and bottom wall of the cranium.", "num": 59},
    {"id": "Q60", "topic": "skull", "format": "fill", "prompt": "The _____ is the hole in the occipital bone that the spinal cord comes through.", "answers": ["foramen magnum"], "explain": "The foramen magnum is the hole for the spinal cord.", "num": 60},
    {"id": "Q61", "topic": "skull", "format": "fill", "prompt": "The _____ bone includes the tear duct, allowing tears to leave the eye.", "answers": ["lacrimal"], "explain": "The lacrimal bone's lacrimal fossa holds the tear duct.", "num": 61},
    {"id": "Q62", "topic": "skull", "format": "fill", "prompt": "The _____ is the only bone of the skull that can move.", "answers": ["mandible"], "explain": "The mandible (lower jaw) is the only movable skull bone.", "common": ["lower jaw", "jaw", "jawbone", "jaw bone"], "num": 62},
    {"id": "Q35", "topic": "spine", "format": "mc", "prompt": "What is the name of the second cervical vertebra?", "options": ["Axis", "Atlas", "Dens", "Sacrum"], "explain": "C1 is the atlas; C2 is the axis.", "num": 35},
    {"id": "Q36", "topic": "spine", "format": "mc", "prompt": "Which vertebra allows the head to rotate from side to side?", "options": ["Axis", "Atlas", "Thoracic", "Sacral"], "explain": "The axis (C2) has the dens, a peg the atlas pivots around, so you can turn your head side to side (\"no\"). The atlas holds up the skull and lets you nod (\"yes\").", "num": 36},
    {"id": "Q37", "topic": "spine", "format": "mc", "prompt": "Which structure in the vertebral column provides cushioning between vertebrae?", "options": ["Intervertebral disks", "Costal cartilage", "Sacral cartilage", "Fibrous layer"], "explain": "Intervertebral disks (made of fibrocartilage) cushion the vertebrae.", "num": 37},
    {"id": "Q38", "topic": "spine", "format": "mc", "prompt": "The vertebral column has a natural curvature to:", "options": ["Distribute pressure and support the body", "Provide a base for muscle attachment", "Make room for nerves in the spinal cord", "Allow for maximum head mobility"], "explain": "The S-shaped curves spread out pressure (weight) and help the spine support the body.", "num": 38},
    {"id": "Q39", "topic": "spine", "format": "mc", "prompt": "Which condition is characterized by an excessive inward curvature of the lumbar spine?", "options": ["Lordosis", "Kyphosis", "Scoliosis", "Text neck"], "explain": "Lordosis = too much inward (swayback) lumbar curve. Kyphosis = too much thoracic curve (hunchback). Scoliosis = sideways curve.", "num": 39},
    {"id": "Q63", "topic": "spine", "format": "fill", "prompt": "The _____ is the tailbone.", "answers": ["coccyx"], "explain": "The coccyx is the tailbone (originally 4 parts that fuse).", "common": ["tailbone", "tail bone"], "num": 63},
    {"id": "Q64", "topic": "spine", "format": "fill", "prompt": "The part of the axis that sticks up into the atlas is known as the _____.", "answers": ["dens", "odontoid process", "odontoid"], "explain": "The dens (odontoid process) is the peg on the axis that the atlas turns around.", "num": 64},
    {"id": "Q65", "topic": "spine", "format": "fill", "prompt": "Prior to ossification, the sacrum was _____ separate pieces.", "answers": ["5", "five", "5 pieces", "five pieces"], "explain": "The sacrum starts as 5 separate pieces that fuse into 1 bone.", "num": 65},
    {"id": "Q66", "topic": "spine", "format": "fill", "prompt": "The intervertebral disks are made of _____ (be specific).", "answers": ["fibrocartilage", "fibrous cartilage", "fibro cartilage"], "explain": "Intervertebral disks are made of fibrocartilage, a tough cartilage that absorbs shock.", "num": 66},

    {"id": "Q83", "topic": "short", "format": "short", "prompt": "What are 2 functions of your vertebral column? (2 points)", "model": "1) It protects the spinal cord. 2) It supports the body and holds the head up (keeps you upright).", "points": ["Protects the spinal cord", "Supports the body / head; keeps you upright", "Also OK: attachment for ribs and muscles; allows bending and twisting"], "explain": "Any 2 real functions earn the points. Protecting the spinal cord and supporting the body are the safest pair.", "num": 83},
    {"id": "Q84", "topic": "short", "format": "short", "prompt": "What happens to the size of the vertebrae as you work your way down the column? Why? (2 points)", "model": "The vertebrae get bigger as you go down the column, because the lower vertebrae have to support more of the body's weight.", "points": ["What: they get bigger (larger, thicker)", "Why: lower vertebrae carry more body weight"], "explain": "Both parts are needed: what happens (bigger) and why (more weight).", "num": 84},
    {"id": "Q85", "topic": "short", "format": "short", "prompt": "How many bones is the entire vertebral column made of? Break it down into the individual sections and how many bones belong in each section. (4 points)", "model": "26 bones: 7 cervical + 12 thoracic + 5 lumbar + 1 sacrum + 1 coccyx.", "points": ["Total: 26", "Cervical: 7", "Thoracic: 12", "Lumbar: 5", "Sacrum: 1 (5 fused pieces) and coccyx: 1 (4 fused pieces)"], "explain": "Tip: breakfast at 7, lunch at 12, dinner at 5. Before fusing, the sacrum is 5 pieces and the coccyx is 4, so the column starts as 33 pieces.", "num": 85, "img": {"fig": "spine"}},
    {"id": "Q86", "topic": "short", "format": "short", "prompt": "What is the difference between the true and false ribs? (2 points)", "model": "True ribs (pairs 1–7) attach directly to the sternum by their own costal cartilage. False ribs (pairs 8–12) don't attach directly: pairs 8–10 attach to the cartilage of the rib above, and pairs 11–12 (floating ribs) don't attach to the sternum at all.", "points": ["True ribs: pairs 1–7, attach directly to the sternum", "False ribs: pairs 8–12, do not attach directly (8–10 join cartilage above; 11–12 float)"], "explain": "Key word: directly.", "num": 86},
    {"id": "Q87", "topic": "short", "format": "short", "prompt": "What are the separate parts of the sternum called? Draw a diagram of the sternum to show these separate parts. Label each part. (3 points)", "model": "Manubrium (top), body (middle, the longest part), and xiphoid process (small tip at the bottom). Draw it like the picture: a wide top piece, a long middle piece, and a small pointed tip.", "points": ["Manubrium: top", "Body: middle", "Xiphoid process: bottom tip"], "explain": "Practice drawing it: 3 pieces stacked top to bottom, each labeled.", "num": 87, "img": {"fig": "sternum", "labels": true}},
    {"id": "Q88", "topic": "short", "format": "short", "prompt": "What are the human girdles called? What is the purpose of each girdle? (3 points)", "model": "The pectoral (shoulder) girdle and the pelvic (hip) girdle. The pectoral girdle (clavicles + scapulae) attaches the arms to the axial skeleton and is loosely attached so the shoulder can move freely. The pelvic girdle (hip bones) attaches the legs to the axial skeleton and is strong and stable so it can support the body's weight (and it protects the pelvic organs).", "points": ["Names: pectoral (shoulder) girdle and pelvic (hip) girdle", "Pectoral: attaches the arms; built for mobility", "Pelvic: attaches the legs; supports body weight (stability)"], "explain": "Both girdles connect limbs to the axial skeleton; one is built for movement, the other for strength.", "num": 88},
    {"id": "Q89", "topic": "short", "format": "short", "prompt": "What is the difference between the function and structure of the tibia and the fibula? (2 points)", "model": "Structure: the tibia is the large, thick shin bone on the medial (big-toe) side; the fibula is thin and on the lateral side. Function: the tibia bears the body's weight; the fibula does not bear weight but helps with balance (and gives muscles a place to attach).", "points": ["Tibia: big/thick, medial, weight-bearing (shin bone)", "Fibula: thin, lateral, not weight-bearing, helps with balance"], "explain": "Hit both words in the question: structure (size/position) and function (weight vs. balance).", "num": 89},
    {"id": "Q90", "topic": "short", "format": "short", "prompt": "What is the difference between the structure, location, and function of the radius and ulna? (2 points)", "model": "Location: the radius is on the thumb (lateral) side of the forearm; the ulna is on the pinky (medial) side. Structure/function: the radius rotates around the ulna (so you can turn your palm over) and makes up most of the wrist joint; the ulna is longer, stays still, and makes up most of the elbow (its olecranon process is the elbow bump).", "points": ["Radius: thumb side, rotates, most of the wrist joint", "Ulna: pinky side, makes up most of the elbow (olecranon)"], "explain": "Cover all three: where each is, what it's shaped like, and what it does.", "num": 90},

// ---------- skull diagrams (original SVG, schematic) ----------
// skullSVG(view, opts): view = 'front' | 'side' | 'base'
// opts.hi    = bone key to highlight (all visible parts of it, both sides)
// opts.arrow = part key; draws a pointer arrow to that part
// opts.tint  = true: cranial bones light blue, facial bones light yellow (explore mode)
// Bones are layered back-to-front; later shapes cover the hidden edges of earlier ones.
const SKULL = (function () {
  const BONE = '#efe2cc', WALL = '#dcc7a6', EDGE = '#5f4c38', HOLE = '#3a2f28', TOOTH = '#fbf8f2', DEEP = '#8a7966';
  const HI = '#f0663a', HI_EDGE = '#7e2a10', HI_WALL = '#d9542b';
  const CRANIAL = { frontal: 1, parietal: 1, temporal: 1, occipital: 1, sphenoid: 1, ethmoid: 1 };
  const TINT_C = '#bfe0f5', TINT_C_WALL = '#a3cde9', TINT_F = '#fbeaa6', TINT_F_WALL = '#efd987';
  let uid = 0;

  // Closed smooth path through points; a point [x, y, 1] is a sharp corner.
  function sm(pts) {
    const n = pts.length, P = i => pts[(i + n) % n];
    let d = `M${P(0)[0]} ${P(0)[1]}`;
    for (let i = 0; i < n; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      const c1 = p1[2] ? p1 : [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = p2[2] ? p2 : [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${r(c1[0])} ${r(c1[1])} ${r(c2[0])} ${r(c2[1])} ${p2[0]} ${p2[1]}`;
    }
    return d + 'Z';
  }
  const r = v => Math.round(v * 10) / 10;
  const poly = pts => 'M' + pts.map(p => p[0] + ' ' + p[1]).join(' L') + 'Z';
  const mirror = (pts, W) => pts.map(p => [W - p[0], p[1], p[2]]);

  function fills(bone, o, wall) {
    if (o.hi === bone) return [wall ? HI_WALL : HI, HI_EDGE];
    if (o.tint && bone) return CRANIAL[bone] ? [wall ? TINT_C_WALL : TINT_C, EDGE] : [wall ? TINT_F_WALL : TINT_F, EDGE];
    return [wall ? WALL : BONE, EDGE];
  }
  function shape(bone, d, o, extra) {
    const wall = extra && extra.wall;
    const [f, s] = fills(bone, o, wall);
    const sw = (o.hi === bone) ? 1.8 : 1.3;
    return `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"${bone ? ` data-bone="${bone}"` : ''}/>`;
  }
  const hole = (d, extra) => `<path d="${d}" fill="${HOLE}" stroke="${EDGE}" stroke-width="1.1"${extra || ''}/>`;
  const ell = (cx, cy, rx, ry, rot) => {
    const k = 0.5523;
    const pts = [[cx + rx, cy], [cx, cy + ry], [cx - rx, cy], [cx, cy - ry]];
    let d = `M${cx + rx} ${cy} C${cx + rx} ${cy + ry * k} ${cx + rx * k} ${cy + ry} ${cx} ${cy + ry} C${cx - rx * k} ${cy + ry} ${cx - rx} ${cy + ry * k} ${cx - rx} ${cy} C${cx - rx} ${cy - ry * k} ${cx - rx * k} ${cy - ry} ${cx} ${cy - ry} C${cx + rx * k} ${cy - ry} ${cx + rx} ${cy - ry * k} ${cx + rx} ${cy}Z`;
    return { d, t: rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : '' };
  };
  const tooth = (x, y, w, hgt, up) => {
    // rounded crown edge on the biting side
    const rr = Math.min(3.5, w / 2.5);
    return up
      ? `<path d="M${x} ${y + hgt} V${y + rr} Q${x} ${y} ${x + rr} ${y} H${x + w - rr} Q${x + w} ${y} ${x + w} ${y + rr} V${y + hgt}Z" fill="${TOOTH}" stroke="#8f816f" stroke-width="1"/>`
      : `<path d="M${x} ${y} V${y + hgt - rr} Q${x} ${y + hgt} ${x + rr} ${y + hgt} H${x + w - rr} Q${x + w} ${y + hgt} ${x + w} ${y + hgt - rr} V${y}Z" fill="${TOOTH}" stroke="#8f816f" stroke-width="1"/>`;
  };

  // ---------------- FRONT VIEW (viewBox 300 x 345) ----------------
  function front(o) {
    const W = 300, out = [], id = 'sk' + (++uid);
    const both = (bone, pts, extra) => { out.push(shape(bone, sm(pts), o, extra)); out.push(shape(bone, sm(mirror(pts, W)), o, extra)); };

    out.push(shape('parietal', sm([[150, 8], [214, 16], [256, 50], [271, 100], [267, 150], [240, 168], [150, 168], [60, 168], [33, 150], [29, 100], [44, 50], [86, 16]]), o));
    both('temporal', [[29, 124], [44, 128], [48, 170], [48, 212], [42, 228], [35, 214], [30, 180]]);

    out.push(shape('frontal', sm([[64, 172, 1], [52, 142], [44, 108], [50, 62], [90, 26], [150, 16], [210, 26], [250, 62], [256, 108], [248, 142], [236, 172, 1]]), o));

  // ---------------- vertebral column, side view (front of the body on the left) ----------------
  function spine(o) {
    o = Object.assign({}, o);
    const out = [];
    const C = [[112, 14], [98, 52], [108, 96], [130, 172], [112, 254], [90, 304], [104, 348]];
    // Catmull-Rom samples of the centerline
    const pts = [];
    for (let i = 0; i < C.length - 1; i++) {
      const p0 = C[Math.max(i - 1, 0)], p1 = C[i], p2 = C[i + 1], p3 = C[Math.min(i + 2, C.length - 1)];
      for (let t = 0; t < 1; t += 0.02) {
        const t2 = t * t, t3 = t2 * t;
        pts.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    pts.push(C[C.length - 1]);
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const at = s => { let i = cum.findIndex(c => c >= s); if (i <= 0) i = 1; const f = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); const p = [pts[i - 1][0] + f * (pts[i][0] - pts[i - 1][0]), pts[i - 1][1] + f * (pts[i][1] - pts[i - 1][1])]; const a = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]); return [p, a]; };
    const total = cum[cum.length - 1];
    const groups = [['cervical', 7, 7, 13], ['thoracic', 12, 9.6, 16], ['lumbar', 5, 13, 21]];
    const sizes = []; groups.forEach(([k, n, hgt, w]) => { for (let i = 0; i < n; i++) sizes.push([k, hgt, w]); });
    const gap = 3.2;
    const need = sizes.reduce((a, s) => a + s[1] + gap, 0);
    let s = Math.max(2, total - need - 2);
    let pB = null;
    const discs = [], bodies = {};
    sizes.forEach(([k, hgt, w], idx) => {
      const [p, a] = at(s + hgt / 2);
      const c = Math.cos(a), si = Math.sin(a);
      const box = [[-hgt / 2, -w / 2], [hgt / 2, -w / 2], [hgt / 2, w / 2], [-hgt / 2, w / 2]].map(([u, v]) => [r(p[0] + u * c - v * si), r(p[1] + u * si + v * c), 1]);
      // spinous process toward the back (right side)
      const sp = [[-hgt * 0.25, -w / 2], [hgt * 0.2, -w / 2], [hgt * 0.45, -w / 2 - w * 0.7], [hgt * 0.05, -w / 2 - w * 0.75]].map(([u, v]) => [r(p[0] + u * c - v * si), r(p[1] + u * si + v * c), 1]);
      (bodies[k] = bodies[k] || []).push(P(k, sm(box), o) + P(k, sm(sp), o));
      if (idx < sizes.length - 1) {
        const [pd, ad] = at(s + hgt + gap / 2);

        if (locked) return;
        if (picked.has(o)) picked.delete(o); else picked.add(o);
        b.classList.toggle('selected', picked.has(o)); b.setAttribute('aria-pressed', String(picked.has(o)));
        b.querySelector('.box').textContent = picked.has(o) ? '✓' : '';
        refresh();
      } }, h('span', { class: 'box' }), h('span', { class: 'lbl' }, o));
      b.dataset.v = o; return b;
    });
    btns.forEach(b => list.appendChild(b));
    area.appendChild(list);
    ctl.getAnswer = () => Array.from(picked);
    ctl.complete = () => picked.size > 0;
    ctl.lock = () => { locked = true; btns.forEach(b => b.setAttribute('disabled', '')); };
    const resetOpts = () => btns.forEach(b => {
      b.classList.remove('selected', 'right', 'wrong', 'missed-opt');
      b.querySelectorAll('.note').forEach(n => n.remove());
      b.querySelector('.box').textContent = '';
    });
    ctl.markFeedback = () => {
      resetOpts();
      btns.forEach(b => {
        const v = b.dataset.v, shouldBe = item.answer.includes(v), was = picked.has(v);
        if (was) b.querySelector('.box').textContent = '✓';
        if (shouldBe && was) { b.classList.add('right'); b.appendChild(h('span', { class: 'note' }, '✓ right')); }
        else if (!shouldBe && was) { b.classList.add('wrong'); b.appendChild(h('span', { class: 'note' }, '✗ should not be selected')); }
        else if (shouldBe && !was) { b.classList.add('missed-opt'); b.querySelector('.box').textContent = '✓'; b.appendChild(h('span', { class: 'note' }, '✓ you missed this one')); }
        else { b.appendChild(h('span', { class: 'note' }, '✓ right (left blank)')); b.querySelector('.note').classList.add('ok'); }
      });
    };
    // Answer key: only the correct options are checked, all in green.
    ctl.showCorrect = () => {
      resetOpts();
      btns.forEach(b => {
        if (item.answer.includes(b.dataset.v)) {
          b.classList.add('right'); b.querySelector('.box').textContent = '✓';
          b.appendChild(h('span', { class: 'note' }, '✓ select'));
        } else {
          b.appendChild(h('span', { class: 'note muted' }, 'leave blank'));
        }
      });
    };
    ctl.showMine = () => ctl.markFeedback();
  }

  // ----- Matching -----
  function renderMatch(item, area, ctl, refresh) {
    const terms = shuffle(item.pairs.map(p => p[0]));
    const defs = shuffle(item.pairs.map(p => p[1]));
    const pairs = {};       // term -> def
    let selTerm = null, selDef = null, locked = false;
    const termBtns = {}, defBtns = {};
    const wrap = h('div', { class: 'match' });
    const colT = h('div', { class: 'col' }, h('div', { class: 'col-title' }, 'Terms'));
    const colD = h('div', { class: 'col' }, h('div', { class: 'col-title' }, 'Matches'));
    terms.forEach(t => {
      const b = h('button', { class: 'chip', onclick: () => { if (locked) return; selTerm = (selTerm === t) ? null : t; tryPair(); paint(); } },
        h('span', { class: 'badge' }, ''), h('span', { class: 'lbl' }, t));
      termBtns[t] = b; colT.appendChild(b);
    });
    defs.forEach(d => {
      const b = h('button', { class: 'chip', onclick: () => { if (locked) return; selDef = (selDef === d) ? null : d; tryPair(); paint(); } },
        h('span', { class: 'badge' }, ''), h('span', { class: 'lbl' }, d));
      defBtns[d] = b; colD.appendChild(b);
    });
    wrap.appendChild(colT); wrap.appendChild(colD);
    area.appendChild(wrap);
    const tools = h('div', { class: 'tools' },
      h('button', { class: 'small-btn', onclick: () => { if (locked) return; for (const k in pairs) delete pairs[k]; selTerm = selDef = null; paint(); } }, 'Clear pairs'),
      h('span', { class: 'hint' }, 'Paired items share the same number.'));
    area.appendChild(tools);

    function tryPair() {
      if (selTerm != null && selDef != null) {
        for (const k in pairs) if (pairs[k] === selDef) delete pairs[k];   // a match can belong to one term only
        pairs[selTerm] = selDef;
        selTerm = selDef = null;
      }
      refresh();
    }
    function paint() {
      const order = Object.keys(pairs); // numbering in pairing order
      for (const t in termBtns) {
        const b = termBtns[t]; const idx = order.indexOf(t);
        b.classList.toggle('selected', selTerm === t);
        b.classList.toggle('paired', idx >= 0);
        b.querySelector('.badge').textContent = idx >= 0 ? String(idx + 1) : '';
      }
      for (const d in defBtns) {
        const b = defBtns[d]; const t = order.find(k => pairs[k] === d); const idx = t ? order.indexOf(t) : -1;
        b.classList.toggle('selected', selDef === d);
        b.classList.toggle('paired', idx >= 0);
        b.querySelector('.badge').textContent = idx >= 0 ? String(idx + 1) : '';
      }
    }
    ctl.getAnswer = () => Object.assign({}, pairs);
    ctl.complete = () => item.pairs.every(([t]) => pairs[t] != null);
    ctl.lock = () => { locked = true; Object.values(termBtns).concat(Object.values(defBtns)).forEach(b => b.setAttribute('disabled', '')); tools.remove(); };
    const allChips = () => Object.values(termBtns).concat(Object.values(defBtns));
    ctl.markFeedback = () => {
      allChips().forEach(b => { b.classList.remove('right', 'wrong'); b.style.minHeight = ''; });
      defs.forEach(d => colD.appendChild(defBtns[d]));   // back to the original order
      paint();
      item.pairs.forEach(([t, d]) => {
        const ok = pairs[t] === d;
        termBtns[t].classList.add(ok ? 'right' : 'wrong');
        if (pairs[t] != null) defBtns[pairs[t]].classList.add(ok ? 'right' : 'wrong');
      });
    };
    // Answer key: each correct match moves directly across from its term, numbered and green.
    ctl.showCorrect = () => {
      const key = Object.fromEntries(item.pairs);
      terms.forEach((t, i) => {
        const d = defBtns[key[t]];
        colD.appendChild(d);
        [termBtns[t], d].forEach(b => {
          b.classList.remove('wrong', 'selected'); b.classList.add('right', 'paired');
          b.querySelector('.badge').textContent = String(i + 1);
        });
      });
      // Line each term up with its match so the pairs read across as rows.
      terms.forEach(t => {
        const a = termBtns[t], d = defBtns[key[t]];
        a.style.minHeight = d.style.minHeight = '';
        const hgt = Math.max(a.offsetHeight, d.offsetHeight) + 'px';
        a.style.minHeight = d.style.minHeight = hgt;
      });
    };
    ctl.showMine = () => ctl.markFeedback();
    ctl.feedbackDetail = () => h('ul', null, item.pairs.map(([t, d]) => {
      const ok = pairs[t] === d;
      return h('li', null, h('span', { class: ok ? 'ok' : 'no' }, ok ? '✓ ' : '✗ '), `${t} → ${pairs[t] || '?'}`, ok ? '' : h('span', null, ' — should be: ', h('b', null, d)));
    }));
  }

  // ----- Sort into boxes -----
  function renderSort(item, area, ctl, refresh) {
    const tiles = shuffle(item.tiles.map(t => t[0]));
    const placed = {};  // tile -> box
    let sel = null, locked = false;
    const pool = h('div', { class: 'pool', role: 'group', 'aria-label': 'Tiles to sort', onclick: e => {
      if (locked) return;
      if (e.target === pool && sel && placed[sel]) { delete placed[sel]; sel = null; paint(); }
    } });
    const boxesEl = h('div', { class: 'boxes' + (item.boxes.length === 2 ? ' two' : '') });
    const boxEls = {};
    item.boxes.forEach(b => {
      const el = h('div', { class: 'dropbox', role: 'button', tabindex: '0', onclick: () => place(b) },
        h('div', { class: 'box-title' }, b), h('div', { class: 'box-tiles' }));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); place(b); } });
      boxEls[b] = el; boxesEl.appendChild(el);
    });
    const tileEls = {};
    tiles.forEach(t => {
      const el = h('button', { class: 'tile', onclick: e => {
        e.stopPropagation(); if (locked) return;
        // A selected tile tapped onto a tile already sitting in a box goes into that box.
        if (sel && sel !== t && placed[t]) { place(placed[t]); return; }
        sel = (sel === t) ? null : t; paint();
      } }, t);
      tileEls[t] = el;
    });
    const poolLabel = h('p', { class: 'hint', style: 'margin:0 0 6px' }, 'Tiles');
    area.appendChild(poolLabel);
    area.appendChild(pool);
    area.appendChild(boxesEl);

    function place(box) {
      if (locked || !sel) return;
      placed[sel] = box; sel = null; paint(); refresh();
    }
    function paint() {
      clear(pool);
      for (const b in boxEls) clear(boxEls[b].querySelector('.box-tiles'));
      tiles.forEach(t => {
        const el = tileEls[t];
        el.classList.toggle('selected', sel === t);
        if (placed[t]) boxEls[placed[t]].querySelector('.box-tiles').appendChild(el); else pool.appendChild(el);
      });
      pool.classList.toggle('empty', tiles.every(t => placed[t]));
      for (const b in boxEls) boxEls[b].classList.toggle('target', !!sel);
    }
    paint();
    ctl.getAnswer = () => Object.assign({}, placed);
    ctl.complete = () => tiles.every(t => placed[t]);
    ctl.lock = () => {
      locked = true; poolLabel.hidden = true; pool.hidden = true;
      tiles.forEach(t => tileEls[t].setAttribute('disabled', ''));
      for (const b in boxEls) { boxEls[b].classList.remove('target'); boxEls[b].removeAttribute('tabindex'); }
    };
    const layout = map => {
      for (const b in boxEls) clear(boxEls[b].querySelector('.box-tiles'));
      tiles.forEach(t => {
        const el = tileEls[t];
        el.classList.remove('right', 'wrong', 'selected');
        el.querySelectorAll('.fix').forEach(f => f.remove());
        boxEls[map[t]].querySelector('.box-tiles').appendChild(el);
      });
    };
    ctl.markFeedback = () => {
      layout(placed);
      item.tiles.forEach(([t, box]) => {
        const ok = placed[t] === box;
        tileEls[t].classList.add(ok ? 'right' : 'wrong');
        if (!ok) tileEls[t].appendChild(h('span', { class: 'fix' }, `→ ${box}`));
      });
    };
    // Answer key: every tile moves into its correct box, all green.
    ctl.showCorrect = () => {
      layout(Object.fromEntries(item.tiles));
      tiles.forEach(t => tileEls[t].classList.add('right'));
    };
    ctl.showMine = () => ctl.markFeedback();
  }

  // ---------- finishing ----------
  function finish() {
    const r = session.results;
    const correct = r.filter(x => x.correct).length;
    const total = r.length;
    if (session.mode === 'topic') { progress.scores[session.topic] = { correct, total }; save(); }
    if (session.mode === 'test') { progress.test = { correct, total }; save(); }
    const root = screens.results; clear(root);
    const pct = total ? Math.round((correct / total) * 100) : 0;
    root.appendChild(h('h1', null, session.mode === 'test' ? 'Practice Test results' : session.mode === 'missed' ? 'Missed Questions round done' : session.mode === 'handout' ? 'Handout 1–82: done' : `${topicName(session.topic)}: set complete`));
    if (session.mode === 'handout') { progress.handout = { correct, total }; save(); }
    root.appendChild(h('div', { class: 'score-card' },
      h('div', { class: 'big' }, `${correct} / ${total}`),
      h('div', { class: 'sub' }, `${pct}% on first try` + (session.mode === 'missed' ? ` · ${progress.missed.length} still in Missed Questions` : ''))));

    if (session.mode === 'test') {
      const perTopic = {};
      r.forEach(x => { const k = x.item.topic; perTopic[k] = perTopic[k] || { c: 0, t: 0 }; perTopic[k].t++; if (x.correct) perTopic[k].c++; });
      const table = h('table', { class: 'per-topic' }, h('thead', null, h('tr', null, h('th', null, 'Topic'), h('th', null, 'Score'))),
        h('tbody', null, TOPICS.filter(t => perTopic[t.key]).map(t => h('tr', null, h('td', null, t.name), h('td', null, `${perTopic[t.key].c} / ${perTopic[t.key].t}`)))));
      root.appendChild(h('h2', null, 'Score by topic'));
      root.appendChild(table);
      const wrong = r.filter(x => !x.correct);
      root.appendChild(h('h2', null, wrong.length ? `Review your ${wrong.length} wrong answer${wrong.length === 1 ? '' : 's'}` : 'No wrong answers. Nice work.'));
      if (wrong.length) root.appendChild(h('p', { class: 'lead' }, 'These were added to Missed Questions.'));
      const list = h('div', { class: 'review' });
      wrong.forEach(x => {
        list.appendChild(h('div', { class: 'review-item' },
          h('div', { class: 'tp' }, topicName(x.item.topic)),
          h('div', { class: 'q' }, (x.item.num ? `#${x.item.num}. ` : '') + x.item.prompt),
          x.item.img ? diagramEl(x.item) : null,
          h('p', null, h('span', { class: 'no' }, 'Your answer: '), answerText(x.item, x.answer)),
          h('p', null, h('span', { class: 'ok' }, 'Correct answer: '), correctText(x.item)),
          h('p', null, x.item.explain)));
      });
      root.appendChild(list);
    }

    const actions = h('div', { class: 'actions' });
    if (session.mode === 'topic') actions.appendChild(h('button', { class: 'primary', onclick: () => startTopic(session.topic) }, 'Practice again'));
    if (session.mode === 'missed') actions.appendChild(h('button', { class: 'primary', disabled: progress.missed.length === 0, onclick: startMissed }, 'Practice again'));
    if (session.mode === 'test') actions.appendChild(h('button', { class: 'primary', onclick: startTest }, 'Take another test'));
    if (session.mode === 'handout') actions.appendChild(h('button', { class: 'primary', onclick: startHandout }, 'Go through it again'));
    actions.appendChild(h('button', { class: 'ghost', onclick: goHome }, 'Home'));
    root.appendChild(actions);
    show('results');
  }


  // ---------- explore ----------
  const EXPLORE = [
    { key: 'front', name: 'Skeleton (front)', figs: ['front'], tint: true },
    { key: 'back', name: 'Skeleton (back)', figs: ['back'], tint: true },
    { key: 'skull', name: 'Skull', figs: ['skull-front', 'skull-side'] },
    { key: 'hand', name: 'Wrist & hand', figs: ['hand'] },
    { key: 'foot', name: 'Ankle & foot', figs: ['foot'] },
    { key: 'spine', name: 'Spine', figs: ['spine'] },
    { key: 'sternum', name: 'Sternum', figs: ['sternum'] }
  ];
  let exploreFig = 'front', exploreSel = null;
  function startExplore() { session = null; exploreSel = null; renderExplore(); show('explore'); }
  function renderExplore() {
    const root = screens.explore; clear(root);
    const ex = EXPLORE.find(e => e.key === exploreFig);
    const info = BANK.info[ex.key];
    root.appendChild(h('h1', null, 'Explore the Bones'));
    root.appendChild(h('p', { class: 'lead' }, 'Pick a picture, then tap a name or tap a bone. The one you pick turns orange.' + (ex.tint ? ' Axial bones are blue; appendicular bones are yellow.' : ex.key === 'skull' ? ' Cranial bones are blue; facial bones are yellow.' : '')));
    const tabs = h('div', { class: 'fig-tabs', role: 'tablist' });
    EXPLORE.forEach(e => tabs.appendChild(h('button', { class: 'fig-tab' + (e.key === exploreFig ? ' on' : ''), role: 'tab', 'aria-selected': String(e.key === exploreFig),
      onclick: () => { exploreFig = e.key; exploreSel = null; renderExplore(); } }, e.name)));
    root.appendChild(tabs);
    const chips = h('div', { class: 'bone-chips' });
    const chipEls = {};
    info.forEach(([key, name]) => { const el = h('button', { class: 'bone-chip', 'aria-pressed': 'false', onclick: () => select(key) }, name); chipEls[key] = el; chips.appendChild(el); });
    root.appendChild(chips);
    const card = h('div', { class: 'bone-card', 'aria-live': 'polite' });
    root.appendChild(card);
    const views = h('div', { class: 'views' + (ex.figs.length > 1 ? '' : ' one') });
    const figEls = ex.figs.map(f => {
      const el = h('figure', { class: 'diagram explore-fig' });
      el.addEventListener('click', e => { const t = e.target.closest('[data-bone]'); if (t && chipEls[t.getAttribute('data-bone')]) select(t.getAttribute('data-bone')); });
      views.appendChild(el); return el;
    });
    root.appendChild(views);
    root.appendChild(h('div', { class: 'actions' }, h('button', { class: 'ghost', onclick: goHome }, 'Home')));
    function paint() {
      for (const k in chipEls) { chipEls[k].classList.toggle('on', k === exploreSel); chipEls[k].setAttribute('aria-pressed', String(k === exploreSel)); }
      ex.figs.forEach((f, i) => { figEls[i].innerHTML = figSVG(f, { tint: !!(ex.tint || ex.key === 'skull'), hi: exploreSel }); figEls[i].appendChild(h('figcaption', null, FIG_NAMES[f])); });
      clear(card);
      if (!exploreSel) { card.appendChild(h('p', { class: 'hint', style: 'margin:0' }, 'No bone picked yet.')); return; }
      const row = info.find(x => x[0] === exploreSel);
      card.appendChild(h('div', { class: 'bone-card-head' }, h('span', { class: 'bone-name' }, row[1]),
        ex.tint ? h('span', { class: 'pill ' + (BODY.AXIAL[exploreSel] ? 'cranial' : 'facial') }, BODY.AXIAL[exploreSel] ? 'Axial' : 'Appendicular') : null));
      card.appendChild(h('p', null, row[2]));
    }
    function select(key) { exploreSel = key; paint(); }
    paint();
  }

  // ---------- home ----------
  function goHome() { session = null; renderHome(); show('home'); }
  function renderHome() {
    const root = screens.home; clear(root);
    root.appendChild(h('h1', null, 'Skeletal System Test Study'));
    root.appendChild(h('p', { class: 'lead' }, 'Every question from the test handout is here, plus the labeling pictures. Each set is 10 questions with instant feedback. Anything you miss comes back at the end of the set and goes into Missed Questions.'));
    root.appendChild(h('button', { class: 'big-btn secondary explore-btn', onclick: startExplore },
      h('span', null, 'Explore the Bones'), h('span', { class: 'meta' }, 'Tap any bone on the skeleton, skull, hand, foot, or spine')));
    const topicBtn = t => {
      const s2 = progress.scores[t.key];
      const missedN = progress.missed.filter(id => byId[id] && byId[id].topic === t.key).length;
      return h('button', { class: 'topic-btn', onclick: () => startTopic(t.key) },
        h('span', { class: 'name' }, t.name),
        h('span', { class: 'meta' },
          h('span', { class: 'score' }, s2 ? `Last score: ${s2.correct}/${s2.total}` : 'Not started'),
          missedN ? h('span', { class: 'pill missed' }, `${missedN} missed waiting`) : (s2 ? h('span', { class: 'pill clear' }, 'No missed questions') : null)));
    };
    root.appendChild(h('h2', null, 'Written test (100 points)'));
    root.appendChild(h('div', { class: 'topics' }, TOPICS.filter(t => !t.label).map(topicBtn)));
    root.appendChild(h('h2', null, 'Labeling test (62 labels)'));
    root.appendChild(h('div', { class: 'topics' }, TOPICS.filter(t => t.label).map(topicBtn)));
    const n = progress.missed.length;
    const acts = h('div', { class: 'home-actions' },
      h('button', { class: 'big-btn secondary', disabled: n === 0, onclick: startMissed }, h('span', null, `Missed Questions (${n})`), h('span', { class: 'meta' }, n ? 'Drill only what you got wrong' : 'Nothing missed yet')),
      h('button', { class: 'big-btn secondary', onclick: startHandout }, h('span', null, 'Handout #1–82 in order'), h('span', { class: 'meta' }, (progress.handout ? `Last: ${progress.handout.correct}/${progress.handout.total} · ` : '') + 'The whole multiple choice and fill-in section, with feedback')),
      h('button', { class: 'big-btn', onclick: startTest }, h('span', null, 'Practice Test'), h('span', { class: 'meta' }, (progress.test ? `Last: ${progress.test.correct}/${progress.test.total} · ` : '') + '30 mixed questions (20 written, 10 labeling), no feedback until the end')));
    root.appendChild(acts);
    const resetRow = h('div', { class: 'reset-row' });
    const confirmBox = h('div', { class: 'confirm' }, h('span', null, 'Erase all scores and the Missed Questions list?'),
      h('button', { class: 'small-btn danger', onclick: () => { progress = freshProgress(); save(); renderHome(); } }, 'Yes, reset'),
      h('button', { class: 'small-btn', onclick: () => { confirmBox.hidden = true; } }, 'Cancel'));
    confirmBox.hidden = true;
    resetRow.appendChild(h('button', { class: 'link-btn', onclick: () => { confirmBox.hidden = !confirmBox.hidden; } }, 'Reset progress'));
    resetRow.appendChild(confirmBox);
    root.appendChild(resetRow);
    root.appendChild(h('p', { class: 'version' }, 'Version 2 · checked'));
  }

  // ---------- boot ----------
  $('homeLink').addEventListener('click', goHome);
  load();
  renderHome();
  show('home');

  // exposed for automated testing only
  window.__sk = { BANK, grade, checkFill, drawFromTopic, getProgress: () => progress, getSession: () => session };
})();

</script>
